function renderMaintenance(){
  var cards = MAINT.map(function(m){
    var v = VEHICLES.find(function(vv){return vv.id===m.vehicleId;});
    if(!v) return "";
    var rem = m.nextKm-v.km;
    var pct = Math.max(0,Math.min(100,(v.km-m.lastKm)/m.intervalKm*100));
    var col = rem<=0?"#ef4444":rem<=2000?"#f97316":rem<=5000?"#eab308":"#22c55e";
    return '<div class="mcard">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:10px;align-items:flex-start;">'
      +'<div><div style="font-weight:700;font-size:14px;cursor:pointer;" onclick="openVehicleDetail('+v.id+')">'+v.spz+' &ndash; '+v.make+' '+v.model+'</div>'
      +'<div style="font-size:12px;color:#999;margin-top:2px;">'+m.type+' | každý '+m.intervalKm.toLocaleString("sk")+' km</div></div>'
      +chipHtml(rem<=0?'IHNEĎ!':rem<=2000?'SKORO!':'+'+rem.toLocaleString("sk")+' km',col)
      +'</div>'
      +'<div class="prog-wrap" style="margin-bottom:8px;"><div class="prog-bar" style="width:'+pct+'%;background:'+col+';"></div></div>'
      +'<div style="display:flex;gap:20px;flex-wrap:wrap;">'
      +'<span style="font-size:12px;color:#999;">Posledný: '+m.lastKm.toLocaleString("sk")+' km ('+fmtDate(m.lastDate)+')</span>'
      +'<span style="font-size:12px;color:#999;">Nasledujúci: '+m.nextKm.toLocaleString("sk")+' km</span>'
      +'<span style="font-size:12px;font-weight:700;color:'+col+';">Zostatok: '+rem.toLocaleString("sk")+' km</span>'
      +'</div></div>';
  }).join("");
  document.getElementById("sec-maintenance").innerHTML =
    '<div class="fleet-sh"><h2>Preventívna údržba</h2></div>'+cards;
}

var fcPinVisible = {};

function cardStatus(c){
  try { return localStorage.getItem("fuelcard_status_"+c.id)||c.status; }
  catch(e){ return c.status; }
}
function cardSpend(c){
  return c.transactions.reduce(function(s,t){return s+t.eur;},0);
}
function getCardPin(id){
  try { return localStorage.getItem("fuelcard_pin_"+id); }
  catch(e){ return null; }
}
function toggleCardPinVisible(id){
  fcPinVisible[id] = !fcPinVisible[id];
  renderFuelCards();
}
function editCardPin(id){
  var cur = getCardPin(id)||"";
  var p = prompt("Zadajte PIN karty (4 číslice).\n\nPIN sa uloží IBA do localStorage tohto prehliadača – v kóde aplikácie nie je.\nPre produkčné nasadenie patria PINy do KeePass, toto je beta evidencia.",cur);
  if(p===null) return;
  p = p.trim();
  if(!/^[0-9]{4}$/.test(p)){ alert("PIN musí byť presne 4 číslice."); return; }
  try { localStorage.setItem("fuelcard_pin_"+id,p); } catch(e){}
  fcPinVisible[id] = true;
  renderFuelCards();
}
function toggleCardBlock(id){
  var c = FUEL_CARDS.find(function(x){return x.id===id;});
  if(!c) return;
  var portal = c.provider==="Shell"?"Shell Fleet Hub":"GreenWay portál";
  if(cardStatus(c)!=="blokovana"){
    if(!confirm("Naozaj zablokovať kartu "+c.numMasked+"?\n\nUPOZORNENIE: Toto je len interná evidencia – skutočné zablokovanie karty treba vykonať v systéme "+portal+".")) return;
    try { localStorage.setItem("fuelcard_status_"+id,"blokovana"); } catch(e){}
  } else {
    if(!confirm("Odblokovať kartu "+c.numMasked+" v evidencii?\n\nNezabudnite kartu odblokovať aj v systéme "+portal+".")) return;
    try { localStorage.setItem("fuelcard_status_"+id,"aktivna"); } catch(e){}
  }
  renderFuelCards();
}

function fuelCardHtml(c){
  var v = VEHICLES.find(function(x){return x.id===c.vehicleId;});
  var blocked = cardStatus(c)==="blokovana";
  var pin = getCardPin(c.id);
  var last = c.transactions.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  var stripeCol = blocked?"#94a3b8":(c.provider==="Shell"?"#e63f2a":"#1faa59");
  return '<div class="fcard '+(c.provider==="Shell"?"fcard-shell":"fcard-gw")+(blocked?" fcard-blocked":"")+'">'
    +'<div class="fcard-stripe" style="background:'+stripeCol+';"></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'
    +'<span style="font-weight:800;font-size:14px;letter-spacing:0.5px;">'+c.provider+' Card</span>'
    +(blocked?'<span class="fcard-blocked-badge">&#x26D4; BLOKOVANÁ</span>':'<span style="font-size:10px;opacity:0.7;">'+(c.unit==="kWh"?"nabíjacia":"palivová")+'</span>')
    +'</div>'
    +'<div class="fcard-num">'+c.numMasked+'</div>'
    +'<div style="font-size:12px;opacity:0.9;margin-bottom:10px;"><strong>'+(v?v.spz:"")+'</strong> '+(v?v.make+" "+v.model:"")
    +'<div style="font-size:10px;opacity:0.75;margin-top:1px;">'+(v?v.costCenter:"")+'</div></div>'
    +'<div class="fcard-row"><span>PIN</span>'
    +'<span style="font-family:monospace;letter-spacing:3px;font-weight:700;">'+(fcPinVisible[c.id]?(pin||"nezadaný"):"••••")+'</span>'
    +'<button type="button" class="fcard-icon-btn" title="'+(fcPinVisible[c.id]?"Skryť PIN":"Zobraziť PIN")+'" onclick="toggleCardPinVisible('+c.id+')"><i class="far '+(fcPinVisible[c.id]?"fa-eye-slash":"fa-eye")+'"></i></button>'
    +'<button type="button" class="fcard-icon-btn" title="Zmeniť PIN" onclick="editCardPin('+c.id+')"><i class="far fa-pen"></i></button>'
    +'</div>'
    +'<div class="fcard-row"><span>Mesačný limit</span><span style="font-weight:700;">'+c.monthlyLimit+' EUR</span></div>'
    +'<div class="fcard-row"><span>Posl. transakcia</span><span>'+(last?fmtDate(last.date)+' &middot; '+last.qty.toFixed(1)+' '+c.unit+' &middot; '+fmtEur(last.eur):'&mdash;')+'</span></div>'
    +'<div class="fcard-row"><span>Celkové výdavky</span><span style="font-weight:800;">'+fmtEur(cardSpend(c))+'</span></div>'
    +'<div class="fcard-actions">'
    +'<button type="button" class="fcard-btn" onclick="openTxModal('+c.id+')"><i class="far fa-list" style="margin-right:5px;"></i>História</button>'
    +'<button type="button" class="fcard-btn" onclick="toggleCardBlock('+c.id+')">'+(blocked?'Odblokovať':'<i class="far fa-ban" style="margin-right:5px;"></i>Blokovať')+'</button>'
    +'</div>'
    +'</div>';
}

    +'<div class="kpi-card"><div class="kpi-card__label">Celkové výdavky</div><div class="kpi-card__value" style="font-size:22px;color:#7c3aed;">'+fmtEur(total)+'</div></div>'

    +'<div class="note-box" style="margin-bottom:20px;"><div class="note-label">Bezpečnosť PINov</div>'

    +'<h3 class="fc-group-title">Shell Card ('+shell.length+')</h3>'

function closeTxModal(){

}

// ===================================================================
// SERVISNÁ HISTÓRIA – sekcia, timeline a formulár
// ===================================================================
function serviceTypeColor(type){
  if(type.indexOf("Výmena")>=0||type.indexOf("Oprava")>=0) return "#e63f2a";
  if(type.indexOf("STK")>=0||type.indexOf("EK")>=0) return "#16a34a";
  if(type.indexOf("bat")>=0||type.indexOf("EV")>=0) return "#0891b2";
  if(type.indexOf("Olej")>=0||type.indexOf("servis")>=0||type.indexOf("Servis")>=0) return "#2563eb";
  return "#7c3aed";
}
function serviceTypeIcon(type){
  if(type.indexOf("Výmena")>=0||type.indexOf("Oprava")>=0) return "far fa-hammer";
  if(type.indexOf("STK")>=0) return "far fa-check-circle";
  if(type.indexOf("bat")>=0||type.indexOf("EV")>=0) return "far fa-plug";
  return "far fa-cog";
}

function renderServiceHistory(){
  var records = getServiceRecords();
  var totalCost = records.reduce(function(s,r){return s+(r.cost||0);},0);
  var thisYear = new Date().getFullYear().toString();
  var yearCost = records.filter(function(r){return r.date.indexOf(thisYear)===0;})
    .reduce(function(s,r){return s+(r.cost||0);},0);
  var withPhoto = records.filter(function(r){return getReceiptPhoto(r.id)||r.receiptKey;}).length;

  var sfVehicle = window._sfVehicleFilter||"all";
  var sfType = window._sfTypeFilter||"all";
  var filtered = records.filter(function(r){
    var mv = sfVehicle==="all"||r.vehicleId===parseInt(sfVehicle,10);
    var mt = sfType==="all"||r.type===sfType;
    return mv&&mt;
  });

  var allTypes = [];
  records.forEach(function(r){ if(allTypes.indexOf(r.type)<0) allTypes.push(r.type); });

  function sKpi(icon,val,label,color){
    return '<div style="background:#fff;border:1px solid #e8e4de;border-radius:10px;padding:14px 16px;">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
      +'<i class="'+icon+'" style="color:'+color+';font-size:15px;"></i>'
      +'<span style="font-size:12px;color:#888;">'+label+'</span></div>'
      +'<div style="font-size:24px;font-weight:800;color:#1a1a1a;font-family:\'Tabac Sans\',Georgia,serif;">'+val+'</div>'
      +'</div>';
  }

  var html = '<div class="fleet-sh"><h2>Servisná história</h2>'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="openServiceForm(null)">'
    +'<i class="far fa-plus" style="margin-right:6px;"></i>Nový záznam</button></div>'

    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;">'
    +sKpi("far fa-history",records.length,"Záznamov celkom","#2563eb")
    +sKpi("far fa-receipt",Math.round(totalCost)+" EUR","Náklady celkom","#7c3aed")
    +sKpi("far fa-calendar",Math.round(yearCost)+" EUR","Náklady "+thisYear,"#e63f2a")
    +sKpi("far fa-image",withPhoto,"S fotkou dokladu","#16a34a")
    +'</div>'

    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid #e8e4de;border-radius:10px;padding:12px 14px;">'
    +'<i class="far fa-filter" style="color:#888;font-size:13px;"></i>'
    +'<select class="vselect" onchange="window._sfVehicleFilter=this.value;renderServiceHistory();">'
    +'<option value="all">Všetky vozidlá</option>'
    +VEHICLES.map(function(v){return '<option value="'+v.id+'"'+(sfVehicle==v.id?' selected':'')+'>'+v.spz+' &mdash; '+v.make+' '+v.model+'</option>';}).join("")
    +'</select>'
    +'<select class="vselect" onchange="window._sfTypeFilter=this.value;renderServiceHistory();">'
    +'<option value="all">Všetky typy</option>'
    +allTypes.map(function(t){return '<option value="'+t+'"'+(sfType===t?' selected':'')+'>'+t+'</option>';}).join("")
    +'</select>'
    +'<span style="font-size:12px;color:#999;margin-left:auto;">'+filtered.length+' záznamov</span>'
    +'</div>';

  if(filtered.length===0){
    html += '<div style="text-align:center;padding:40px 0;color:#888;">'
      +'<i class="far fa-history" style="font-size:32px;display:block;margin-bottom:10px;"></i>'
      +'Žiadne záznamy nezodpovedajú filtru</div>';
  } else {
    html += '<div style="position:relative;">'
      +'<div style="position:absolute;left:20px;top:0;bottom:0;width:2px;background:#e8e4de;z-index:0;"></div>';
    filtered.forEach(function(r){
      var v = VEHICLES.find(function(vv){return vv.id===r.vehicleId;});
      var col = serviceTypeColor(r.type);
      var icon = serviceTypeIcon(r.type);
      var hasPhoto = getReceiptPhoto(r.id);
      var isNew = r.id.indexOf("sr_")===0;
      html += '<div style="display:flex;gap:16px;margin-bottom:20px;position:relative;z-index:1;">'
        +'<div style="width:42px;height:42px;border-radius:50%;background:'+col+';flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #f6f5f0;">'
        +'<i class="'+icon+'" style="color:#fff;font-size:15px;"></i></div>'
        +'<div style="flex:1;background:#fff;border:1px solid #e8e4de;border-radius:12px;padding:14px 16px;'+(isNew?'border-left:3px solid '+col+';':'')+'">'
        +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'
        +'<div><div style="font-size:14px;font-weight:700;">'+r.type+'</div>'
        +(v?'<div style="font-size:12px;color:#888;margin-top:2px;cursor:pointer;" onclick="openVehicleDetail('+v.id+')"><i class="far fa-car" style="margin-right:4px;"></i>'+v.spz+' &mdash; '+v.make+' '+v.model+'</div>':'')
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0;">'
        +'<div style="font-size:13px;font-weight:700;color:'+col+';">'+fmtDate(r.date)+'</div>'
        +(r.cost>0?'<div style="font-size:12px;font-weight:700;color:#7c3aed;">'+fmtEur(r.cost)+'</div>':'')
        +'</div></div>'
        +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#666;">'
        +'<span><i class="far fa-building" style="margin-right:4px;color:#aaa;"></i>'+r.shop+'</span>'
        +'<span><i class="far fa-car" style="margin-right:4px;color:#aaa;"></i>'+r.km.toLocaleString("sk")+' km</span>'
        +(r.note?'<span style="color:#888;font-style:italic;">&#x201E;'+r.note+'&#x201C;</span>':'')
        +'</div>'
        +'<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">'
        +(hasPhoto
          ?'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="showReceiptPhoto(\''+r.id+'\')"><i class="far fa-image" style="margin-right:5px;"></i>Doklad</button>'
          :'<span style="font-size:11px;color:#bbb;"><i class="far fa-image" style="margin-right:3px;"></i>Bez dokladu</span>')
        +(isNew
          ?'<button type="button" style="border:none;background:none;cursor:pointer;font-size:12px;color:#e63f2a;padding:4px;margin-left:auto;" onclick="if(confirm(\'Zmazať záznam?\')){deleteServiceRecord(\''+r.id+'\');renderServiceHistory();}"><i class="far fa-trash-can-xmark"></i> Zmazať</button>'
          :'')
        +'</div>'
        +'</div></div>';
    });
    html += '</div>';
  }
  document.getElementById("sec-service").innerHTML = html;
}

function showReceiptPhoto(recordId){
  var dataURL = getReceiptPhoto(recordId);
  if(!dataURL){ alert("Fotka nie je dostupná."); return; }
  var w = window.open("","_blank","width=600,height=800");
  if(!w){ alert("Prehliadač zablokoval nové okno."); return; }
  w.document.write('<img src="'+dataURL+'" style="max-width:100%;height:auto;">');
  w.document.close();
}

// Formulár nového záznamu
function openServiceForm(vehicleId){
  var modal = document.getElementById("service-form-modal");
  if(!modal) return;
  var sel = document.getElementById("sf-vehicle");
  sel.innerHTML = VEHICLES.map(function(v){
    return '<option value="'+v.id+'"'+(v.id===vehicleId?' selected':'')+'>'+v.spz+' &mdash; '+v.make+' '+v.model+'</option>';
  }).join("");
  if(vehicleId){ sel.disabled = true; sel.style.opacity = "0.6"; }
  else { sel.disabled = false; sel.style.opacity = "1"; }
  document.getElementById("sf-type").innerHTML = SERVICE_TYPES.map(function(t){
    return '<option>'+t+'</option>';
  }).join("");
  document.getElementById("sf-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("sf-km").value = "";
  document.getElementById("sf-type").value = "Olej + filtre";
  document.getElementById("sf-shop").value = "";
  document.getElementById("sf-cost").value = "";
  document.getElementById("sf-note").value = "";
  document.getElementById("sf-receipt-preview").innerHTML = "";
  document.getElementById("sf-receipt-data").value = "";
  document.getElementById("sf-receipt-file").value = "";
  modal.style.display = "flex";
  document.getElementById("sf-date").focus();
}
function closeServiceForm(){
  document.getElementById("service-form-modal").style.display = "none";
}
function submitServiceForm(){
  var vehicleId = parseInt(document.getElementById("sf-vehicle").value,10);
  var date = document.getElementById("sf-date").value;
  var km = parseInt(document.getElementById("sf-km").value,10);
  var type = document.getElementById("sf-type").value;
  var shop = document.getElementById("sf-shop").value.trim();
  var cost = parseFloat(document.getElementById("sf-cost").value)||0;
  var note = document.getElementById("sf-note").value.trim();
  var receipt = document.getElementById("sf-receipt-data").value;
  if(!date){ alert("Zadajte dátum."); return; }
  if(!km||km<0){ alert("Zadajte platný počet km."); return; }
  if(!shop){ alert("Zadajte servisné stredisko."); return; }
  var record = {vehicleId:vehicleId,date:date,km:km,type:type,shop:shop,cost:cost,note:note,receiptKey:null};
  if(!addServiceRecord(record)){ alert("Chyba pri ukladaní záznamu."); return; }
  if(receipt&&saveReceiptPhoto(record.id,receipt)){
    record.receiptKey = record.id;
    try {
      var stored = JSON.parse(localStorage.getItem("fleet_service_records")||"[]");
      stored.forEach(function(r){ if(r.id===record.id) r.receiptKey = record.id; });
      localStorage.setItem("fleet_service_records",JSON.stringify(stored));
    } catch(e){}
  }
  closeServiceForm();
  if(document.getElementById("sec-service").classList.contains("active")) renderServiceHistory();
  if(currentVehicleId===vehicleId&&detailType==="vehicle") openVehicleDetail(vehicleId,"vhistoria");
}
function previewReceipt(input){
  if(!input.files||!input.files[0]) return;
  var file = input.files[0];
  if(file.size>3*1024*1024){
    alert("Fotka je väčšia ako 3 MB. Vyberte menší súbor alebo odfotťe v nižšom rozlíšení.");
    input.value = "";
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    document.getElementById("sf-receipt-data").value = e.target.result;
    document.getElementById("sf-receipt-preview").innerHTML = file.type==="application/pdf"
      ?'<div style="font-size:12px;color:#666;margin-top:6px;"><i class="far fa-image" style="margin-right:4px;"></i>'+file.name+'</div>'
      :'<img src="'+e.target.result+'" style="max-height:80px;max-width:160px;border-radius:6px;object-fit:cover;margin-top:6px;">';
  };
  reader.readAsDataURL(file);
}

// Timeline pre záložku História v detaile vozidla
function buildServiceTimeline(vehicleId){
  var records = getServiceRecords().filter(function(r){ return r.vehicleId===vehicleId; });
  if(records.length===0){
    return '<div style="text-align:center;padding:24px 0;color:#888;font-size:13px;">'
      +'<i class="far fa-history" style="font-size:24px;display:block;margin-bottom:8px;color:#ccc;"></i>'
      +'Žiadna servisná história</div>'
      +'<button type="button" class="btn btn--primary btn--small mb-none" style="width:100%;margin-top:8px;" onclick="openServiceForm('+vehicleId+')">'
      +'<i class="far fa-plus" style="margin-right:6px;"></i>Pridať prvý záznam</button>';
  }
  var totalCost = records.reduce(function(s,r){return s+(r.cost||0);},0);
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<span style="font-size:12px;color:#888;">'+records.length+' záznamov &middot; celkom <strong style="color:#7c3aed;">'+fmtEur(totalCost)+'</strong></span>'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="openServiceForm('+vehicleId+')">'
    +'<i class="far fa-plus" style="margin-right:5px;"></i>Pridať</button></div>';
  html += '<div style="position:relative;">'
    +'<div style="position:absolute;left:15px;top:0;bottom:0;width:2px;background:#e8e4de;"></div>';
  records.slice(0,8).forEach(function(r){
    var col = serviceTypeColor(r.type);
    var hasPhoto = getReceiptPhoto(r.id);
    html += '<div style="display:flex;gap:12px;margin-bottom:14px;position:relative;">'
      +'<div style="width:32px;height:32px;border-radius:50%;background:'+col+';flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;">'
      +'<i class="'+serviceTypeIcon(r.type)+'" style="color:#fff;font-size:12px;"></i></div>'
      +'<div style="flex:1;padding-top:4px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;">'
      +'<span style="font-size:13px;font-weight:700;">'+r.type+'</span>'
      +'<span style="font-size:11px;color:#888;">'+fmtDate(r.date)+'</span></div>'
      +'<div style="font-size:11px;color:#888;margin-top:2px;">'+r.shop+' &middot; '+r.km.toLocaleString("sk")+' km'
      +(r.cost>0?' &middot; <strong style="color:#7c3aed;">'+fmtEur(r.cost)+'</strong>':'')+'</div>'
      +(r.note?'<div style="font-size:11px;color:#aaa;font-style:italic;margin-top:2px;">'+r.note+'</div>':'')
      +(hasPhoto?'<button type="button" style="font-size:11px;color:#2563eb;background:none;border:none;cursor:pointer;padding:0;margin-top:4px;" onclick="showReceiptPhoto(\''+r.id+'\')"><i class="far fa-image" style="margin-right:3px;"></i>Doklad</button>':'')
      +'</div></div>';
  });
  if(records.length>8){
    html += '<div style="text-align:center;margin-top:8px;">'
      +'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="window._sfVehicleFilter=\''+vehicleId+'\';goTo(\'service\');">'
      +'Zobraziť celú históriu ('+records.length+' záznamov)</button></div>';
  }
  return html+'</div>';
}

// DOKUMENTY VOZIDIEL – sekcia, Drive URL, checklist, prílohy
// ===================================================================
function renderDocuments(){
  var statusList = VEHICLES.map(function(v){
    var check = getDocCheck(v.id);
    var critCount = DOC_CHECKLIST.filter(function(d){ return d.critical; }).length;
    var doneCount = DOC_CHECKLIST.filter(function(d){ return d.critical&&check[d.key]; }).length;
    return {v:v,pct:docCompleteness(v.id),driveUrl:getDriveUrl(v.id),doneCount:doneCount,critCount:critCount};
  });
  var complete = statusList.filter(function(s){ return s.pct===100; }).length;
  var incomplete = statusList.filter(function(s){ return s.pct<100&&s.pct>=50; }).length;
  var critical = statusList.filter(function(s){ return s.pct<50; }).length;
  var withDrive = statusList.filter(function(s){ return !!s.driveUrl; }).length;

  function dKpi(icon,val,label,color){
    return '<div style="background:#fff;border:1px solid #e8e4de;border-radius:10px;padding:14px 16px;">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
      +'<i class="'+icon+'" style="color:'+color+';font-size:15px;"></i>'
      +'<span style="font-size:12px;color:#888;">'+label+'</span></div>'
      +'<div style="font-size:28px;font-weight:800;color:#1a1a1a;font-family:\'Tabac Sans\',Georgia,serif;">'+val+'</div>'
      +'</div>';
  }

  var html = '<div class="fleet-sh"><h2>Dokumenty vozidiel</h2>'
    +'<span style="font-size:12px;color:#999;">TP &middot; poistka &middot; STK protokol &middot; splnomocnenie</span></div>'

    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;">'
    +dKpi("far fa-check-circle",complete,"Kompletné","#16a34a")
    +dKpi("far fa-circle-exclamation",incomplete,"Neúplné (50&ndash;99&nbsp;%)","#f97316")
    +dKpi("far fa-triangle-exclamation",critical,"Kritické (&lt;50&nbsp;%)","#e63f2a")
    +dKpi("far fa-link",withDrive,"Prepojené s Drive","#2563eb")
    +'</div>'

    +'<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:#888;align-items:center;">'
    +'<span><i class="far fa-check-circle" style="color:#16a34a;margin-right:4px;"></i>Povinný dok. splnený</span>'
    +'<span><i class="far fa-circle-exclamation" style="color:#f97316;margin-right:4px;"></i>Chýba povinný dok.</span>'
    +'<span><i class="far fa-link" style="color:#2563eb;margin-right:4px;"></i>Prepojené s Google Drive</span>'
    +'</div>'

    +'<div class="vtable-wrap"><table class="fleet-table"><thead><tr>'
    +'<th></th><th>SPZ / Vozidlo</th><th>Nákladové stredisko</th>'
    +'<th style="text-align:center;">Kompletnosť</th>'
    +'<th style="text-align:center;">TP</th>'
    +'<th style="text-align:center;">Poistka</th>'
    +'<th style="text-align:center;">STK prot.</th>'
    +'<th style="text-align:center;">Splnomocnenie</th>'
    +'<th>Google Drive</th><th></th>'
    +'</tr></thead><tbody>';

  statusList.forEach(function(s){
    var v = s.v;
    var check = getDocCheck(v.id);
    function docCell(key){
      var done = !!check[key];
      return '<td style="text-align:center;">'
        +'<i class="'+(done?'far fa-check-circle':'far fa-circle-exclamation')+'" '
        +'style="font-size:15px;color:'+(done?'#16a34a':'#f97316')+';cursor:pointer;" '
        +'title="'+(done?'Označené ako existujúce':'Chýba – kliknite na označenie')+'" '
        +'onclick="event.stopPropagation();toggleDocCheck('+v.id+',\''+key+'\');renderDocuments();"></i>'
        +'</td>';
    }
    var pctColor = s.pct===100?'#16a34a':s.pct>=50?'#f97316':'#e63f2a';
    html += '<tr onclick="openVehicleDocuments('+v.id+')" style="cursor:pointer;">'
      +'<td style="width:52px;"><img class="vthumb" src="'+getEffectivePhoto(v)+'" loading="lazy" onerror="photoFallback(this,'+v.id+')"></td>'
      +'<td><strong>'+v.spz+'</strong><div style="font-size:11px;color:#999;">'+v.make+' '+v.model+'</div></td>'
      +'<td style="font-size:12px;color:#666;">'+(v.costCenter||'&mdash;')+'</td>'
      +'<td style="text-align:center;min-width:100px;">'
      +'<div style="font-size:12px;font-weight:700;color:'+pctColor+';margin-bottom:3px;">'+s.doneCount+'/'+s.critCount+'</div>'
      +'<div style="height:5px;background:#f0ede8;border-radius:3px;overflow:hidden;width:80px;margin:0 auto;">'
      +'<div style="height:100%;border-radius:3px;background:'+pctColor+';width:'+s.pct+'%;"></div></div>'
      +'</td>'
      +docCell('tp')+docCell('insurance')+docCell('stk_protocol')+docCell('authorization')
      +'<td onclick="event.stopPropagation();">'
      +(s.driveUrl
        ?'<a href="'+s.driveUrl+'" target="_blank" rel="noopener" class="btn btn--secondary btn--small mb-none" style="font-size:11px;white-space:nowrap;"><i class="far fa-link" style="margin-right:4px;"></i>Otvoriť</a>'
        :'<button type="button" class="btn btn--small mb-none" style="font-size:11px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;" onclick="editDriveUrl('+v.id+')"><i class="far fa-plus" style="margin-right:4px;"></i>Pridať URL</button>')
      +'</td>'
      +'<td onclick="event.stopPropagation();">'
      +'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="openVehicleDocuments('+v.id+')"><i class="far fa-chevron-right"></i></button>'
      +'</td>'
      +'</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById("sec-documents").innerHTML = html;
}

function openVehicleDocuments(vehicleId){
  openVehicleDetail(vehicleId,"vdokumenty");
}

function editDriveUrl(vehicleId){
  var v = VEHICLES.find(function(vv){ return vv.id===vehicleId; });
  if(!v) return;
  var url = prompt("Zadajte URL Google Drive priečinka pre "+v.spz+" – "+v.make+" "+v.model+":\n(Nájdete ho v Drive: pravé tlačidlo na priečinok → Získať odkaz)",getDriveUrl(vehicleId));
  if(url===null) return;
  url = url.trim();
  if(url&&url.indexOf("drive.google.com")<0&&url.indexOf("docs.google.com")<0){
    if(!confirm("URL nevyzerá ako Google Drive odkaz. Uložiť aj napriek tomu?")) return;
  }
  saveDriveUrl(vehicleId,url);
  if(document.getElementById("sec-documents").classList.contains("active")) renderDocuments();
}

        +'<div style="font-size:11px;color:#aaa;">'+fmtDate(f.uploadedAt)+'</div></div>'
        +(f.dataURL?'<button type="button" style="border:none;background:none;cursor:pointer;color:#2563eb;font-size:13px;padding:4px;" onclick="showDocFile('+vehicleId+',\''+f.id+'\')" title="Zobraziť"><i class="far fa-eye"></i></button>':'')
        +'<button type="button" style="border:none;background:none;cursor:pointer;color:#888;font-size:13px;padding:4px;" '
        +'onclick="if(confirm(\'Zmazať súbor?\')){deleteDocFile('+vehicleId+',\''+f.id+'\');openVehicleDetail('+vehicleId+',\'vdokumenty\');}" title="Zmazať">'
        +'<i class="far fa-trash-can-xmark"></i></button>'

    });
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:#bbb;text-align:center;padding:4px 0;">Žiadne prílohy</div>';
  }
  html += '</div>';

  // Blok 4: Poznámka
  html += '<div style="background:#fff;border:1px solid #e8e4de;border-radius:10px;padding:14px 16px;">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:8px;"><i class="far fa-comment-lines" style="margin-right:6px;color:#888;"></i>Poznámka k dokumentom</div>'
    +'<textarea id="dp-note-'+vehicleId+'" class="fleet-input" rows="3" placeholder="napr. TP v šanóne mIS, poistka obnovená 03/2026..." style="resize:vertical;" oninput="saveDocNote('+vehicleId+',this.value)">'
    +note.replace(/</g,"&lt;")
    +'</textarea></div>';

  return html;
}

function dpHandleFile(file,vehicleId){
  if(!file) return;
  if(file.size>2*1024*1024){
    alert("Súbor je príliš veľký (max 2 MB). Pre veľké dokumenty použite Google Drive.");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    if(addDocFile(vehicleId,{name:file.name,type:file.type,dataURL:e.target.result})){
      openVehicleDetail(vehicleId,"vdokumenty");
    }
  };
  reader.readAsDataURL(file);
}

function showDocFile(vehicleId,fileId){
  var f = getDocFiles(vehicleId).find(function(x){ return x.id===fileId; });
  if(!f||!f.dataURL){ alert("Súbor nie je dostupný."); return; }
  var w = window.open("","_blank","width=700,height=900");
  if(!w){ alert("Prehliadač zablokoval nové okno."); return; }
  if(f.type==="application/pdf"){
    w.document.write('<iframe src="'+f.dataURL+'" style="width:100%;height:100vh;border:none;"></iframe>');
  } else {
    w.document.write('<img src="'+f.dataURL+'" style="max-width:100%;height:auto;">');
  }
  w.document.close();
}

function buildAlerts(){
  var alerts = [];
  VEHICLES.forEach(function(v){
    var sd = daysTo(v.stk), pd = daysTo(v.insurance), kl = kmLeft(v);
    if(sd<=60) alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"STK",days:sd,vid:v.id,cat:"Vozidlo"});
    if(pd<=60) alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"Poistenie",days:pd,vid:v.id,cat:"Vozidlo"});
    if(kl<=5000&&v.status==="aktivne") alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"Servis – "+kl.toLocaleString("sk")+" km",days:999,vid:v.id,cat:"Servis"});
    v.vignettes.forEach(function(c){
      var vd = daysTo((v.vignetteExp&&v.vignetteExp[c])||VIGN_EXPIRY[c]);
      if(vd<=60) alerts.push({who:v.spz+" – známka "+c,spz:v.spz,label:"Diaľničná známka "+c,days:vd,vid:v.id,cat:"Známka"});
    });
  });
  DRIVERS.forEach(function(d){
    var lpd = daysTo(d.licenseExp), tpd = daysTo(d.trainingExp);
    if(lpd<=90) alerts.push({who:d.name,spz:"VP",label:"Platnosť VP",days:lpd,did:d.id,cat:"Vodič"});
    if(tpd<=60) alerts.push({who:d.name,spz:"Školenie",label:"Expirácia školenia",days:tpd,did:d.id,cat:"Vodič"});
    if(!d.authorized) alerts.push({who:d.name,spz:"Oprávnenie",label:"Neoprávnený vodič",days:-1,did:d.id,cat:"Vodič"});
  });
  alerts.sort(function(a,b){return a.days-b.days;});
  return alerts;
}

var ALERT_CAT_COLS = {"Vozidlo":"#2563eb","Servis":"#f97316","Známka":"#8b5cf6","Vodič":"#ec4899"};

function renderAlerts(){
  var alerts = buildAlerts();
  var rows = alerts.map(function(a){
    var dc = urgCol(a.days===999?20:a.days);
    var click = a.vid?'onclick="openVehicleDetail('+a.vid+')"'
      :a.did?'onclick="openDriverDetail('+a.did+')"':'';
    return '<div class="alert-row" '+click+'>'
      +chipHtml(a.days===999?'Km!':a.days<0?'expir.':a.days+'d',dc)
      +'<div style="flex:1;"><span style="font-size:14px;font-weight:700;">'+a.who+'</span> <span style="font-size:13px;color:#999;">| '+a.label+'</span></div>'
      +chipHtml(a.cat,ALERT_CAT_COLS[a.cat]||"#64748b")
      +'<span style="font-size:12px;color:#999;margin-left:6px;">'+a.spz+'</span>'
      +'<i class="far fa-chevron-right" style="font-size:11px;color:#ccc;margin-left:10px;"></i>'
      +'</div>';
  }).join("");
  var content = alerts.length

}

function getFleetContext(){
  var urgent = [];
  VEHICLES.forEach(function(v){
    var sd = daysTo(v.stk), pd = daysTo(v.insurance), kl = kmLeft(v);
    if(sd<=30) urgent.push(v.spz+": STK expiruje za "+sd+" dní");
    if(pd<=30) urgent.push(v.spz+": Poistenie expiruje za "+pd+" dní");
    if(kl<=5000&&v.status==="aktivne") urgent.push(v.spz+": Servis nutný, zostatok "+kl+" km");
    if(v.status==="servis") urgent.push(v.spz+": Momentálne v servise ("+v.note+")");
  });
  DRIVERS.forEach(function(d){
    var ld = daysTo(d.licenseExp);
    if(ld<=60&&ld>0) urgent.push(d.name+": VP expiruje za "+ld+" dní");

    if(!d.trainingValid) urgent.push(d.name+": Školenie expirované");
  });

  return {
    celkomVozidiel: VEHICLES.length,
    aktivne: VEHICLES.filter(function(v){return v.status==="aktivne";}).length,
    vServise: VEHICLES.filter(function(v){return v.status==="servis";}).length,
    celkomVodicov: DRIVERS.length,
    neopravneni: DRIVERS.filter(function(d){return !d.authorized;}).length,
    urgentneUpozornenia: urgent,
    vozidla: VEHICLES.map(function(v){
      var dr = DRIVERS.find(function(d){return d.id===v.driverId;});
      return {spz:v.spz,vozidlo:v.make+" "+v.model,rok:v.year,km:v.km,status:v.status,palivo:v.fuel,stredisko:v.costCenter,vodic:dr?dr.name:"nepriradený",stk:v.stk,poistenie:v.insurance,servisPri:v.nextServiceKm,zostatokKm:kmLeft(v),lokalita:v.location,znamky:v.vignettes};
    }),
    vodici: DRIVERS.map(function(d){
      var v = VEHICLES.find(function(vv){return vv.id===d.vehicleId;});

function localResponse(q){
  var p = currentPersona;
  var ql = fold(q.toLowerCase());

  var urgent = VEHICLES.filter(function(v){return daysTo(v.stk)<=30||daysTo(v.insurance)<=30||kmLeft(v)<=5000;});
  var inSvc = VEHICLES.filter(function(v){return v.status==="servis";});
  var active = VEHICLES.filter(function(v){return v.status==="aktivne";});
  var expVP = DRIVERS.filter(function(d){return daysTo(d.licenseExp)<=90;});
  var noTrain = DRIVERS.filter(function(d){return !d.trainingValid;});

  // Konkrétne vozidlo (SPZ, model alebo značka)
  var foundV = null;
  VEHICLES.forEach(function(v){
    if(ql.indexOf(fold(v.spz.toLowerCase()))>=0) foundV = v;
    else {
      var words = fold(v.model.toLowerCase()).split(/[^a-z0-9-]+/).filter(function(w){return w.length>=3;});
      if(words.some(function(w){return ql.indexOf(w)>=0;})) foundV = v;
      else if(ql.indexOf(fold(v.make.toLowerCase()))>=0) foundV = v;
    }
  });

  // Konkrétny vodič (časť mena)
  var foundD = null;
  DRIVERS.forEach(function(d){
    var parts = fold(d.name.toLowerCase()).split(" ");
    if(parts.some(function(part){return part.length>3&&ql.indexOf(part)>=0;})) foundD = d;
  });

  function pfx(text){
    return p==="hoke"?"Dovolím si informovať: "+text
      :p==="han"?text+"\nKtoré lode potrebujú pozornosť, kapitán?"
      :"Hlásim: "+text;
  }
  function wrap(text){
    return p==="charon"?"Zaznamenané v evidencii. "+text+" Bez ďalších obolov nepokračujeme."
      :p==="han"?"Počuj, "+text+" Mám zlý pocit z toho, keď sa o flotile nevie všetko."
      :text+" Budem na to dohliadať, nebojte sa.";
  }

  if(foundV){
    var v = foundV;
    var dr = DRIVERS.find(function(d){return d.id===v.driverId;});
    var sd = daysTo(v.stk), kl = kmLeft(v);
    return wrap(v.spz+" – "+v.make+" "+v.model+" ("+v.year+")"
      +"\nStav: "+statusLabel(v.status)+", km: "+v.km.toLocaleString("sk")+", lokalita: "+v.location
      +"\nNákladové stredisko: "+(v.costCenter||"-")
      +"\nSTK: "+fmtDate(v.stk)+" ("+(sd<0?"EXPIROVALA!":sd+" dní")+")"
      +"\nPoistenie: "+fmtDate(v.insurance)
      +"\nDo servisu: +"+kl.toLocaleString("sk")+" km"
      +"\nPrimárny vodič: "+(dr?dr.name:"nepriradený")
      +(v.note?"\nPoznámka: "+v.note:"")+".");
  }

  if(foundD){
    var d = foundD;
    var vd = VEHICLES.find(function(v2){return v2.id===d.vehicleId;});
    var ld = daysTo(d.licenseExp);
    return wrap(d.name+" ("+d.role+")"
      +"\nVozidlo: "+(vd?vd.spz+" "+vd.make+" "+vd.model:"nepriradené")
      +"\nVP platí do: "+fmtDate(d.licenseExp)+" ("+(ld<0?"EXPIROVAL!":ld+" dní")+")"
      +"\nŠkolenie: "+(d.trainingValid?"platné do "+fmtDate(d.trainingExp):"EXPIROVANÉ!")
      +"\nOprávnenie: "+(d.authorized?"áno":"NIE – neoprávnený vodič!")+".");
  }

  if(ql.indexOf("upozorn")>=0||ql.indexOf("urgent")>=0||ql.indexOf("kriz")>=0||ql.indexOf("problem")>=0||ql.indexOf("pozornost")>=0){
    if(!urgent.length&&!inSvc.length) return wrap("Všetko je v poriadku. Žiadne urgentné upozornenia.");
    var lines = [];
    if(inSvc.length) lines.push("V servise: "+inSvc.map(function(v){return v.spz;}).join(", "));
    urgent.forEach(function(v){
      var sd = daysTo(v.stk), kl = kmLeft(v);
      if(sd<=30) lines.push(v.spz+": STK "+(sd<0?"už expirovala!":"expiruje za "+sd+" dní"));
      if(kl<=5000) lines.push(v.spz+": servis nutný, zostatok "+kl+" km");
    });
    return pfx(lines.slice(0,6).join("\n"));
  }

  if(ql.indexOf("stk")>=0||ql.indexOf("technicka kontrola")>=0){
    var stkExp = VEHICLES.filter(function(v){return daysTo(v.stk)<=60;});
    if(!stkExp.length) return wrap("Všetky STK sú v poriadku, žiadna neexpiruje do 60 dní.");
    return pfx("STK expiruje v nasledujúcich 60 dňoch:\n"+stkExp.map(function(v){
      var d = daysTo(v.stk);
      return v.spz+" "+v.make+" "+v.model+": "+(d<0?"UŽ EXPIROVALA!":d+" dní – "+fmtDate(v.stk));
    }).join("\n"));
  }

  if(ql.indexOf("poist")>=0){
    var pExp = VEHICLES.filter(function(v){return daysTo(v.insurance)<=60;});
    if(!pExp.length) return wrap("Všetky poistenia sú v poriadku.");
    return pfx("Poistenie expiruje:\n"+pExp.map(function(v){return v.spz+": "+fmtDate(v.insurance);}).join("\n"));
  }

  if(ql.indexOf("servis")>=0||ql.indexOf("udrzb")>=0||ql.indexOf("oprav")>=0||ql.indexOf("dok")>=0){
    var srvKm = VEHICLES.filter(function(v){return kmLeft(v)<=5000&&v.status==="aktivne";});
    var r2 = [];
    if(inSvc.length) r2.push("Momentálne v servise: "+inSvc.map(function(v){return v.spz+" – "+v.note;}).join("; "));
    if(srvKm.length) r2.push("Blíži sa servis (do 5000 km): "+srvKm.map(function(v){return v.spz+" (+"+kmLeft(v)+" km)";}).join(", "));
    return r2.length?pfx(r2.join("\n")):wrap("Žiadne vozidlo nepotrebuje servis v krátkodobom horizonte.");
  }

  if(ql.indexOf("vodic")>=0||ql.indexOf("sofer")>=0||ql.indexOf("pilot")>=0||ql.indexOf("dus")>=0||ql.indexOf("povinnost")>=0){
    var issues = [];
    if(noTrain.length) issues.push("Expirované školenie: "+noTrain.map(function(d){return d.name;}).join(", "));
    if(expVP.length) issues.push("VP expiruje do 90 dní: "+expVP.map(function(d){return d.name+" ("+daysTo(d.licenseExp)+"d)";}).join(", "));
    var unauth = DRIVERS.filter(function(d){return !d.authorized;});
    if(unauth.length) issues.push("Neoprávnení vodiči: "+unauth.map(function(d){return d.name;}).join(", "));
    return issues.length?pfx(issues.join("\n")):wrap("Všetci vodiči majú platné doklady a školenia.");
  }

  if(ql.indexOf("naklad")>=0||ql.indexOf("cena")>=0||ql.indexOf("eur")>=0||ql.indexOf("obolus")>=0||ql.indexOf("dlhuje")>=0){
    var total = VEHICLES.reduce(function(s,v){return s+(v.cost||0);},0);
    var top = VEHICLES.slice().sort(function(a,b){return b.cost-a.cost;}).slice(0,3);
    return pfx("Celkové servisné náklady: "+fmtEur(total)+"\nNajdrahšie: "+top.map(function(v){return v.spz+" ("+fmtEur(v.cost)+")";}).join(", "));
  }

  if(ql.indexOf("jazd")>=0||ql.indexOf("kilom")>=0||ql.indexOf(" km")>=0||ql.indexOf("najazd")>=0){
    var sorted = VEHICLES.slice().sort(function(a,b){return b.km-a.km;});
    return pfx("Najvyšší nájazd: "+sorted.slice(0,3).map(function(v){return v.spz+" – "+v.km.toLocaleString("sk")+" km";}).join(", "));
  }

  if(ql.indexOf("dialn")>=0||ql.indexOf("znamk")>=0||ql.indexOf("vignet")>=0||ql.indexOf("hyperpriestor")>=0||ql.indexOf("skok")>=0){
    var czVeh = VEHICLES.filter(function(v){return v.vignettes.indexOf("CZ")>=0;});
    var atVeh = VEHICLES.filter(function(v){return v.vignettes.indexOf("AT")>=0;});
    return pfx("Diaľničné známky:\nSK: všetky vozidlá ("+VEHICLES.length+")\nCZ: "+czVeh.length+" vozidiel\nAT: "+atVeh.length+" vozidiel");
  }

  if(ql.indexOf("vozid")>=0||ql.indexOf("auto")>=0||ql.indexOf("flot")>=0||ql.indexOf("celk")>=0||ql.indexOf("stav")>=0||ql.indexOf("preh")>=0||ql.indexOf("lod")>=0){
    return pfx("Stav flotily: "+VEHICLES.length+" vozidiel celkom\n"
      +"Aktívne: "+active.length+" | V servise: "+inSvc.length+" | Vyžaduje pozornosť: "+urgent.length+"\n"
      +"Vodičov: "+DRIVERS.length+" | Bez platného školenia: "+noTrain.length);
  }

  // Predvolená odpoveď podľa persony
  if(p==="hoke") return "Dobrý deň. Môžem Vás informovať o stave vozidiel, STK, poistení, servisoch alebo vodičoch. Čím Vám môžem pomôcť?";
  if(p==="han") return "Počuj, na to ti odpoveď neviem – skús sa pýtať na konkrétnu loď (napr. MT101AA), pilota, STK, servis alebo stav flotily. Mám všetky dáta z paluby!";
  return "Pred prechodom na druhú stranu potrebujem presnejší dotaz. Spýtaj sa na konkrétne vozidlo, vodiča, STK, poistenie alebo servis.";
}

// Privítacie notifikácie
function getNotifications(){
  var msgs = [];
  VEHICLES.forEach(function(v){
    var sd = daysTo(v.stk);
    if(sd<0) msgs.push({type:"danger",text:v.spz+": STK už EXPIROVALO!"});
    else if(sd<=14) msgs.push({type:"danger",text:v.spz+" "+v.make+" "+v.model+": STK expiruje o "+sd+" dní!"});
    var pd = daysTo(v.insurance);
    if(pd>=0&&pd<=14) msgs.push({type:"warning",text:v.spz+": Poistenie expiruje o "+pd+" dní"});
    var kl = kmLeft(v);
    if(kl<=2000&&v.status==="aktivne") msgs.push({type:"warning",text:v.spz+": Zostatok do servisu iba "+kl+" km!"});
  });
  DRIVERS.forEach(function(d){
    if(!d.authorized) msgs.push({type:"danger",text:d.name+" nemá platné oprávnenie na jazdu!"});
    if(!d.trainingValid) msgs.push({type:"warning",text:d.name+": Školenie expirované – nutná obnova."});
  });
  return msgs;
}

function notifPrefix(type){
  if(currentPersona==="hoke") return type==="danger"?"Dovoľte mi upozorniť: ":"Rada pre Vás: ";
  if(currentPersona==="han") return type==="danger"?"POZOR, kapitán! ":"Signál z flotily: ";
  return type==="danger"?"ZASTAVIŤ! ":"Chýba obolus: ";
}

function appendMsg(role,text,isNotif,notifType){
  var p = PERSONAS[currentPersona];
  var el = document.createElement("div");
  var now = new Date().toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"});
  if(role==="user"){
    el.className = "msg msg-user";
    el.innerHTML = text+'<div class="msg-time" style="text-align:right;">'+now+'</div>';
  } else {
    el.className = "msg msg-bot"+(isNotif?" msg-notif":"");
    el.style.background = p.msgBg;
    el.style.color = p.msgColor;
    if(isNotif) el.style.borderColor = notifType==="danger"?"#ef4444":"#f97316";
    el.innerHTML = text.replace(/\n/g,"<br>")+'<div class="msg-time">'+now+'</div>';
  }
  var mc = document.getElementById("chat-messages");
  mc.appendChild(el);
  mc.scrollTop = mc.scrollHeight;
}

function showLoading(){
  var p = PERSONAS[currentPersona];
  var el = document.createElement("div");
  el.id = "chat-loader";
  el.className = "msg msg-bot msg-loading";
  el.style.background = p.msgBg;
  var c = p.msgColor;
  el.innerHTML = '<div class="dot" style="background:'+c+'"></div><div class="dot" style="background:'+c+'"></div><div class="dot" style="background:'+c+'"></div>';
  var mc = document.getElementById("chat-messages");
  mc.appendChild(el);
  mc.scrollTop = mc.scrollHeight;
}
function hideLoading(){
  var el = document.getElementById("chat-loader");
  if(el) el.remove();
}

async function sendMsg(){
  if(isLoading) return;
  var inp = document.getElementById("chat-input");
  var text = inp.value.trim();
  if(!text) return;
  inp.value = "";

  appendMsg("user",text);
  chatHistory.push({role:"user",content:text});

  isLoading = true;
  showLoading();
  try {
    var reply = await callAI(text);
    hideLoading();
    appendMsg("bot",reply);
    chatHistory.push({role:"assistant",content:reply});
  } catch(e) {
    hideLoading();
    appendMsg("bot","Ospravedlňujem sa, nastala technická chyba. Skúste to prosím znovu.");
  }
  isLoading = false;
}

function renderQuickActions(){
  var qa;
  if(currentPersona==="hoke") qa = ["Urgentné upozornenia","Stav vozového parku","Ktoré auto potrebuje servis","Ktorí vodiči majú expirujúce VP"];
  else if(currentPersona==="han") qa = ["Ktoré lode sú v doku?","Kríza! Rýchly prehľad!","Nájdi mi voľného pilota","Čas na hyperpriestorový skok?"];
  else qa = ["Kto mi dlhuje obolus?","Uzavri jazdu","Kto nemá splnené povinnosti?","Prehľad duší v systéme"];

  var p = PERSONAS[currentPersona];
  document.getElementById("chat-quick").innerHTML = qa.map(function(q){
    return '<button type="button" class="qbtn" onclick="quickAsk(\''+q+'\')" style="color:'+p.msgColor+';background:'+p.msgBg+';border-color:'+p.msgColor+'33;">'+q+'</button>';
  }).join("");
}

function quickAsk(q){
  document.getElementById("chat-input").value = q;
  sendMsg();
}

function switchPersona(key){
  currentPersona = key;
  chatHistory = [];
  document.querySelectorAll(".persona-btn").forEach(function(b){ b.classList.remove("active"); });
  document.getElementById("pbtn-"+key).classList.add("active");

  var p = PERSONAS[key];
  document.getElementById("chat-window").style.background = p.bg;
  document.getElementById("chat-head").style.background = p.headBg;
  document.getElementById("chat-persona-avatar").textContent = p.avatar;
  document.getElementById("chat-persona-name").textContent = p.name;
  document.getElementById("chat-persona-name").style.color = "#fff";
  document.getElementById("chat-persona-sub").textContent = p.sub;
  document.getElementById("chat-persona-sub").style.color = "rgba(255,255,255,0.65)";

  var inp = document.getElementById("chat-input");
  inp.style.background = p.inputBg;
  inp.style.color = "#fff";

  var send = document.getElementById("chat-send");
  send.style.background = "rgba(255,255,255,0.2)";
  send.style.color = "#fff";

  var fab = document.getElementById("chat-fab");
  fab.style.background = p.fabBg;
  fab.style.color = p.fabColor;
  fab.textContent = p.avatar;

  document.querySelectorAll(".persona-btn").forEach(function(b){
    b.style.background = "rgba(255,255,255,0.08)";
    b.style.color = "rgba(255,255,255,0.6)";
  });
  var activeBtn = document.getElementById("pbtn-"+key);
  activeBtn.style.background = "rgba(255,255,255,0.22)";
  activeBtn.style.color = "#fff";

  document.getElementById("chat-messages").innerHTML = "";
  renderQuickActions();

  // Pozdrav + max 3 najurgentnejšie upozornenia
  setTimeout(function(){
    appendMsg("bot",p.greeting);
    chatHistory.push({role:"assistant",content:p.greeting});
    var notifs = getNotifications();
    if(notifs.length>0){
      setTimeout(function(){
        var notifText = notifs.slice(0,3).map(function(n){return notifPrefix(n.type)+n.text;}).join("\n");
        if(notifs.length>3) notifText += "\n...a "+(notifs.length-3)+" ďalších upozornení.";
        appendMsg("bot",notifText,true,"warning");
      },700);
    }
  },200);
}

function toggleChat(){
  chatOpen = !chatOpen;
  var win = document.getElementById("chat-window");
  if(chatOpen){
    win.classList.add("open");
    if(document.getElementById("chat-messages").children.length===0){
      switchPersona(currentPersona);
    }
    document.getElementById("chat-input").focus();
  } else {
    win.classList.remove("open");
  }
}

  fab.style.color = p.fabColor;

</script>
