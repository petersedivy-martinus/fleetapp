<!doctype html>
<html lang="sk" class="fonts-loaded">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martinus Fleet</title>
  <link rel="stylesheet" href="https://mrtns.sk/assets/martinus/lb/fonts/Tabac-Sans/style.css?v=0f2ed26c">
  <link rel="stylesheet" href="https://mrtns.sk/assets/martinus/lb/styles/main.css?v=bd16785f">
  <style>
    /* ===== MARTINUS FLEET – štýly nad Martinus DS ===== */
    body { background: #f6f5f0; }

    /* SIDEBAR */
    #fleet-sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh;
      background: #1a1a1a; display: flex; flex-direction: column; z-index: 200; overflow-y: auto; }
    #fleet-sidebar .sb-logo { padding: 20px 18px 16px; border-bottom: 1px solid #333; }
    #fleet-sidebar .sb-logo-name { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700;
      font-size: 16px; color: #fff; letter-spacing: 0.01em; }
    #fleet-sidebar .sb-logo-sub { font-size: 11px; color: #888; margin-top: 3px; }
    #fleet-sidebar nav { padding: 10px 8px; flex: 1; }
    .nav-btn { display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 10px 12px; background: transparent; border: none; border-radius: 8px; cursor: pointer;
      margin-bottom: 2px; color: #aaa; font-family: 'Tabac Sans', Georgia, serif; font-weight: 600;
      font-size: 13px; text-align: left; transition: all 0.12s; gap: 10px; }
    .nav-btn i { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
    .nav-btn span { flex: 1; }
    .nav-btn:hover { background: #2a2a2a; color: #fff; }
    .nav-btn.active { background: #2d2d2d; color: #fff; border-left: 3px solid #e63f2a; }
    .nav-badge { background: #e63f2a; color: #fff; border-radius: 20px; padding: 1px 8px;
      font-size: 10px; font-weight: 700; }
    #fleet-sidebar .sb-foot { padding: 14px 18px; border-top: 1px solid #333; font-size: 11px; color: #555; }

    /* TOP HEADER */
    #top-header { position: fixed; top: 0; left: 220px; right: 0; height: 56px; background: #fff;
      border-bottom: 1px solid #e8e4de; display: flex; align-items: center; gap: 16px;
      padding: 0 20px; z-index: 150; }
    #top-header .th-search { flex: 1; max-width: 520px; margin: 0 auto; position: relative; }
    #top-header .th-search input { width: 100%; border: 1.5px solid #e8e4de; border-radius: 24px;
      padding: 8px 16px 8px 38px; font-size: 13px; font-family: 'Tabac Sans', Georgia, serif;
      outline: none; background: #faf9f7; transition: border-color 0.15s; }
    #top-header .th-search input:focus { border-color: #e63f2a; background: #fff; }
    #top-header .th-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #aaa; font-size: 13px; }
    #top-header .th-icons { display: flex; gap: 6px; align-items: center; }
    .th-icon-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent;
      cursor: pointer; color: #666; font-size: 15px; display: flex; align-items: center;
      justify-content: center; transition: background 0.12s; }
    .th-icon-btn:hover { background: #f0ede8; }
    .th-avatar { width: 32px; height: 32px; border-radius: 50%; background: #e63f2a; color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
      font-family: 'Tabac Sans', Georgia, serif; }

    /* MAIN */
    #main { margin-left: 220px; min-height: 100vh; padding: 80px 32px 28px; background: #f6f5f0; }
    .fleet-section { display: none; }
    .fleet-section.active { display: block; }
    .fleet-sh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .fleet-sh h2 { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 22px; color: #1a1a1a; }

    /* CHIP */
    .chip { display: inline-block; border: 1px solid; border-radius: 5px; padding: 2px 9px;
      font-size: 11px; font-weight: 700; white-space: nowrap; }

    /* WIDGETY (dashboard) */
    .wgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .wgrid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 1200px) { .wgrid { grid-template-columns: repeat(2, 1fr); } .wgrid-2 { grid-template-columns: 1fr; } }
    .widget { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; padding: 16px 18px; }
    .widget-title { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 14px;
      color: #1a1a1a; margin-bottom: 14px; }
    .wstat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0;
      border-bottom: 1px solid #f5f2ed; font-size: 13px; }
    .wstat-row:last-child { border-bottom: none; }
    .wstat-label { display: flex; align-items: center; gap: 8px; color: #444; }
    .wdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .wcount { background: #f0ede8; color: #1a1a1a; border-radius: 12px; padding: 1px 9px;
      font-size: 11px; font-weight: 700; min-width: 24px; text-align: center; }
    .wbig-pair { display: flex; gap: 28px; align-items: flex-end; padding: 6px 0; }
    .wbig-num { font-family: 'Tabac Sans', Georgia, serif; font-size: 34px; font-weight: 800; line-height: 1; }
    .wbig-sub { font-size: 11px; color: #999; margin-top: 5px; font-weight: 600; }
    .wbar-row { margin-bottom: 10px; }
    .wbar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    .wbar-track { height: 7px; background: #f0ede8; border-radius: 4px; overflow: hidden; }
    .wbar-fill { height: 100%; border-radius: 4px; }
    .wfeed-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f2ed;
      align-items: flex-start; font-size: 13px; }
    .wfeed-row:last-child { border-bottom: none; }

    /* WIDGET „BLÍŽI SA TERMÍN“ */
    .deadline-row { display: flex; gap: 10px; align-items: center; padding: 8px 0;
      border-bottom: 1px solid #f5f2ed; cursor: pointer; transition: opacity 0.4s; font-size: 13px; }
    .deadline-row:hover { background: #faf9f7; }
    .dl-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 13px; flex-shrink: 0; }
    .dl-done-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #e8e4de;
      background: #fff; color: #bbb; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 11px; flex-shrink: 0; transition: all 0.15s; }
    .dl-done-btn:hover { border-color: #22c55e; color: #22c55e; background: #e6f4ea; }
    .dl-toggle { background: none; border: none; cursor: pointer; color: #e63f2a; font-size: 12px;
      font-weight: 700; font-family: 'Tabac Sans', Georgia, serif; padding: 8px 0 0; }
    .dl-toggle:hover { text-decoration: underline; }

    /* TABUĽKOVÉ ZOZNAMY */
    .vtabs { display: flex; gap: 0; border-bottom: 2px solid #e8e4de; margin-bottom: 14px; }
    .vtab { background: none; border: none; padding: 10px 18px; font-size: 13px; font-weight: 700;
      font-family: 'Tabac Sans', Georgia, serif; color: #888; cursor: pointer; position: relative;
      transition: color 0.12s; }
    .vtab:hover { color: #1a1a1a; }
    .vtab.active { color: #e63f2a; }
    .vtab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 2px; background: #e63f2a; }
    .vfilter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .vfilter-row .fleet-search { max-width: 260px; }
    .fleet-search { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 9px 14px; font-size: 13px;
      font-family: 'Tabac Sans', Georgia, serif; color: #1a1a1a; background: #fff; outline: none;
      width: 100%; transition: border-color 0.15s; }
    .fleet-search:focus { border-color: #e63f2a; }
    .vselect { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 8px 12px; font-size: 12px;
      font-family: 'Tabac Sans', Georgia, serif; font-weight: 600; color: #444; background: #fff;
      outline: none; cursor: pointer; }
    .vcount-info { font-size: 12px; color: #999; margin-left: auto; }
    .vtable-wrap { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; overflow: auto; }
    .fleet-table { width: 100%; border-collapse: collapse; }
    .fleet-table th { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.7px;
      text-transform: uppercase; padding: 10px 14px; background: #f9f8f5; text-align: left;
      border-bottom: 1px solid #e8e4de; }
    .fleet-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f2ede8; vertical-align: middle; }
    .fleet-table tr:hover td { background: #faf9f7; }
    .fleet-table tr:last-child td { border-bottom: none; }
    .vthumb { width: 52px; height: 36px; border-radius: 6px; object-fit: cover; display: block; background: #e8e4de; }
    .davatar-sm { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; background: #e8e4de; }
    .vstatus-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
      margin-right: 6px; vertical-align: middle; }

    /* KPI KARTY (kniha jázd) */
    .kpi-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .kpi-card { background: #fff; border: 1px solid #e8e4de; border-radius: 10px; padding: 18px 22px;
      flex: 1; min-width: 130px; }
    .kpi-card__label { font-size: 10px; color: #999; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; margin-bottom: 6px; }
    .kpi-card__value { font-family: 'Tabac Sans', Georgia, serif; font-size: 28px; font-weight: 700;
      line-height: 1; color: #1a1a1a; }

    /* PALIVOVÉ KARTY */
    .fcard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px; margin-bottom: 26px; }
    .fcard { border-radius: 14px; padding: 20px 18px 16px; color: #fff; position: relative;
      overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
    .fcard-shell { background: linear-gradient(135deg, #2d2a26, #4a4540); }
    .fcard-gw { background: linear-gradient(135deg, #0e3d24, #1d7a47); }
    .fcard-blocked { filter: grayscale(0.65); opacity: 0.92; }
    .fcard-stripe { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
    .fcard-num { font-family: monospace; font-size: 16px; letter-spacing: 2px; margin-bottom: 10px; }
    .fcard-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
    .fcard-row > span:first-child { opacity: 0.7; min-width: 110px; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.5px; }
    .fcard-icon-btn { background: rgba(255,255,255,0.12); border: none; border-radius: 5px;
      color: #fff; cursor: pointer; width: 24px; height: 24px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .fcard-icon-btn:hover { background: rgba(255,255,255,0.25); }
    .fcard-actions { display: flex; gap: 8px; margin-top: 12px; }
    .fcard-btn { flex: 1; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; color: #fff; cursor: pointer; padding: 7px 10px; font-size: 12px;
      font-weight: 700; font-family: 'Tabac Sans', Georgia, serif; }
    .fcard-btn:hover { background: rgba(255,255,255,0.28); }
    .fcard-blocked-badge { background: #fff; color: #b91c1c; border-radius: 5px; padding: 2px 8px;
      font-size: 10px; font-weight: 800; }
    .fc-group-title { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 16px;
      margin: 6px 0 12px; color: #1a1a1a; }

    /* FORMULÁRE */
    .fleet-input { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 8px 11px; font-size: 13px;
      font-family: 'Tabac Sans', Georgia, serif; color: #1a1a1a; background: #fff; outline: none;
      width: 100%; transition: border-color 0.15s; }
    .fleet-input:focus { border-color: #e63f2a; }
    .fleet-select { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 8px 11px; font-size: 13px;
      font-family: 'Tabac Sans', Georgia, serif; color: #1a1a1a; background: #fff; outline: none; width: 100%; }
    .fleet-label { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.6px; display: block;
      margin-bottom: 4px; text-transform: uppercase; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .fleet-form-card { background: #fff; border: 2px solid #e63f2a; border-radius: 12px; padding: 18px;
      margin-bottom: 16px; display: none; }
    .fleet-form-card.open { display: block; }
    .fleet-card { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; }

    /* DETAIL PANEL */
    #detail-panel { position: fixed; top: 0; right: 0; width: 460px; height: 100vh; background: #fff;
      border-left: 1px solid #e8e4de; z-index: 300; display: none; flex-direction: column;
      overflow: hidden; box-shadow: -8px 0 32px rgba(0,0,0,0.10); }
    #detail-panel.open { display: flex; }
    .dp-head { padding: 20px 22px; border-bottom: 1px solid #e8e4de; flex-shrink: 0; }
    .dp-title { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 20px; color: #1a1a1a; }
    .dp-sub { font-size: 13px; color: #888; margin-top: 3px; }
    .dp-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
    .dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .dp-cell { background: #f6f5f0; border-radius: 8px; padding: 10px 13px; }
    .dp-cell-label { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; margin-bottom: 3px; }
    .dp-cell-val { font-size: 13px; font-weight: 700; color: #1a1a1a; }
    .dp-tab-row { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
    .dp-tab-btn { background: #f6f5f0; border: 1px solid #e8e4de; border-radius: 7px; padding: 6px 13px;
      font-size: 12px; cursor: pointer; font-family: 'Tabac Sans', Georgia, serif; font-weight: 600;
      color: #888; transition: all 0.12s; }
    .dp-tab-btn:hover { background: #ede9e2; color: #1a1a1a; }
    .dp-tab-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .info-section { background: #f9f8f5; border-radius: 10px; padding: 13px 15px; margin-bottom: 12px;
      border: 1px solid #ede9e2; }
    .info-section-title { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.7px;
      text-transform: uppercase; margin-bottom: 8px; }
    .term-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
    .term-label { font-size: 12px; color: #888; min-width: 120px; }
    .note-box { background: #fff8e6; border: 1px solid #f0c040; border-radius: 8px; padding: 11px 13px;
      margin-bottom: 10px; }
    .note-label { font-size: 10px; color: #856404; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 3px; }
    .note-text { font-size: 13px; color: #5c4a00; }
    .vign-flags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .vign-flag { border: 1px solid; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .authorized-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .auth-pill { background: #fce8e6; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 20px;
      padding: 2px 10px; font-size: 11px; font-weight: 600; }

    /* DOKUMENTY / FAKTÚRY */
    .drop-zone { border: 2px dashed #e8e4de; border-radius: 10px; padding: 22px; text-align: center;
      cursor: pointer; transition: all 0.15s; background: #faf9f7; margin-bottom: 12px; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #e63f2a; background: #fce8e6; }
    .drop-zone-icon { font-size: 28px; margin-bottom: 7px; }
    .drop-zone-text { font-size: 13px; color: #888; font-weight: 500; }
    .drop-zone-sub { font-size: 11px; color: #bbb; margin-top: 3px; }
    .invoice-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: #f9f8f5;
      border-radius: 8px; margin-bottom: 6px; border: 1px solid #e8e4de; }
    .invoice-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .invoice-icon.pdf { background: #fce8e6; color: #c0392b; }
    .invoice-icon.img { background: #e8f0fe; color: #1a56db; }
    .invoice-icon.other { background: #e8f5ea; color: #1a7a3a; }
    .invoice-meta { flex: 1; min-width: 0; }
    .invoice-name { font-size: 13px; font-weight: 600; color: #1a1a1a; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .invoice-detail { font-size: 11px; color: #aaa; margin-top: 1px; }
    .invoice-type { font-size: 10px; color: #888; background: #ede9e2; border-radius: 4px;
      padding: 2px 7px; font-weight: 600; white-space: nowrap; }
    .invoice-del { background: none; border: none; cursor: pointer; color: #e63f2a; font-size: 16px;
      padding: 4px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
    .invoice-del:hover { opacity: 1; background: #fce8e6; }
    .inv-form { background: #fff; border: 1px solid #e8e4de; border-radius: 8px; padding: 13px;
      margin-bottom: 10px; display: none; }
    .inv-form.open { display: block; }

    /* INLINE EDITÁCIA (stredisko, lokalita, termíny) */
    .dp-cell-select { font-size: 12px; font-weight: 700; padding: 5px 8px; cursor: pointer; }
    .term-edit-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 12px;
      padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
    .term-edit-btn:hover { color: #e63f2a; background: #fce8e6; }

    /* UPLOAD FOTOGRAFIE VOZIDLA */
    .photo-action-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 12px; margin-bottom: 14px; }
    .custom-photo-badge { display: inline-flex; align-items: center; gap: 5px;
      background: #e63f2a; color: #fff; border-radius: 20px; padding: 3px 10px;
      font-size: 11px; font-weight: 700; font-family: 'Tabac Sans', Georgia, serif; }

    /* ÚDRŽBA */
    .mcard { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; padding: 16px 18px;
      margin-bottom: 10px; }
    .prog-wrap { height: 6px; background: #ede9e2; border-radius: 3px; overflow: hidden; }
    .prog-bar { height: 100%; border-radius: 3px; }

    /* UPOZORNENIA */
    .alert-row { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f2ede8;
      align-items: center; }
    .alert-row:last-child { border-bottom: none; }
    .alert-row:hover { background: #faf9f7; cursor: pointer; }

    /* OVERLAY + KPI MODAL */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 250; display: none; }
    #overlay.open { display: block; }
    .kpi-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 400; display: none;
      align-items: center; justify-content: center; padding: 24px; }
    .kpi-modal.open { display: flex; }
    .kpi-modal-box { background: #fff; border-radius: 14px; max-width: 920px; width: 100%;
      max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
    .kpi-modal-head { padding: 16px 20px; border-bottom: 1px solid #e8e4de; display: flex;
      justify-content: space-between; align-items: center; flex-shrink: 0; }
    .kpi-modal-title { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 17px; }
    .kpi-modal-body { overflow-y: auto; }

    /* CHATBOT */
    #chat-fab { position: fixed; bottom: 24px; right: 24px; z-index: 500; border: none; cursor: pointer;
      border-radius: 50%; width: 56px; height: 56px; font-size: 22px; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.25); transition: all 0.2s;
      background: #1a1a1a; color: #fff; font-family: 'Tabac Sans', Georgia, serif; }
    #chat-fab:hover { transform: scale(1.08); }
    #chat-window { position: fixed; bottom: 92px; right: 24px; width: 380px; height: 560px; z-index: 500;
      display: none; flex-direction: column; border-radius: 16px; overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.22); font-family: 'Tabac Sans', Georgia, serif; }
    #chat-window.open { display: flex; }
    #chat-head { padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #chat-persona-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    #chat-persona-name { font-weight: 700; font-size: 14px; flex: 1; }
    #chat-persona-sub { font-size: 11px; opacity: 0.7; margin-top: 1px; }
    #chat-switcher { padding: 8px 12px; display: flex; gap: 6px; flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1); }

<script>
// ===================================================================
// GLOBÁLNY STAV – deklarovaný pred prvým volaním render funkcií
// ===================================================================
var vehicleFilter = "all", vehicleSearch = "", ccFilter = "all";
var driverFilter = "all", driverSearch = "";
var currentPersona = "hoke", chatHistory = [];
var chatOpen = false, isLoading = false;
var detailType = null, detailId = null;
var currentVehicleId = null;
var _pendingInvFile = null, _pendingDrDoc = null;
var INV_COUNTER = 9000, DRDOC_COUNTER = 5000;

// ===================================================================
// POMOCNÉ FUNKCIE
// ===================================================================
function fold(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function daysTo(d){ return Math.ceil((new Date(d)-new Date())/86400000); }
function urgCol(d){ return d<0?"#ef4444":d<=30?"#f97316":d<=90?"#eab308":"#22c55e"; }
function fmtDate(d){ return d?new Date(d).toLocaleDateString("sk-SK"):"-"; }
function kmLeft(v){ return Math.max(0,v.nextServiceKm-v.km); }
function fmtEur(n){ return (+(n||0)).toFixed(2)+" EUR"; }
function chipHtml(label,col){ return '<span class="chip" style="background:'+col+'18;color:'+col+';border-color:'+col+'30">'+label+'</span>'; }
function statusCol(s){ return s==="aktivne"?"#22c55e":s==="servis"?"#f97316":"#94a3b8"; }
function statusLabel(s){ return s==="aktivne"?"Aktívne":s==="servis"?"V servise":"Neaktívne"; }
function fuelLabel(f){ return f==="elektro"?"Elektro":f==="benzin"?"Benzín":"Nafta"; }
function termChip(label,date){ var d=daysTo(date),col=urgCol(d); return '<div class="term-row"><span class="term-label">'+label+'</span>'+chipHtml(fmtDate(date)+" | "+(d<0?"expir.":d+"d"),col)+'</div>'; }
function termChipEdit(label,date,entity,id,field,years){
  var fid = "renew-"+entity+"-"+id+"-"+field;
  var d = daysTo(date), col = urgCol(d);
  return '<div class="term-row"><span class="term-label">'+label+'</span>'
    +chipHtml(fmtDate(date)+" | "+(d<0?"expir.":d+"d"),col)
    +'<button type="button" class="term-edit-btn" title="Označiť ako platné / nastaviť nový termín" onclick="toggleRenew(\''+fid+'\')"><i class="far fa-pen"></i></button>'
    +'</div>'
    +'<div class="term-row" id="'+fid+'" style="display:none;">'
    +'<span class="term-label" style="font-size:11px;color:#aaa;">Nová platnosť</span>'
    +'<input type="date" id="'+fid+'-date" class="fleet-input" style="max-width:150px;padding:4px 8px;font-size:12px;" value="'+plusYears(years)+'">'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="saveRenew(\''+entity+'\','+id+',\''+field+'\')">Uložiť</button>'
    +'</div>';
}
function fmtFileSize(bytes){
  if(!bytes) return "";
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return Math.round(bytes/1024)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

// Avatary vodičov (ui-avatars.com, 10 farieb podľa photoIdx)
var AVATAR_COLORS = ["1e3a8a","7c3aed","0f766e","be185d","b45309","0e7490","4d7c0f","9d174d","374151","b91c1c"];
function avatarUrl(d){
  var parts = fold(d.name).replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean);
  var nm = parts.length>1 ? parts[0]+"+"+parts[parts.length-1] : (parts[0]||"X");
  return "https://ui-avatars.com/api/?name="+nm+"&background="+AVATAR_COLORS[(d.photoIdx||0)%AVATAR_COLORS.length]+"&color=fff&size=128&bold=true";
}

// ===================================================================
// SVG FALLBACK PRE FOTOGRAFIE VOZIDIEL
// ===================================================================
var MAKE_COLORS = {
  "Škoda":{bg1:"#1a3a6b",bg2:"#2563eb",accent:"#60a5fa"},
  "Ford":{bg1:"#1c1f2e",bg2:"#1d4ed8",accent:"#3b82f6"},
  "Mercedes-Benz":{bg1:"#1a1a2e",bg2:"#52525b",accent:"#a1a1aa"},
  "Tesla":{bg1:"#1a0a0a",bg2:"#dc2626",accent:"#f87171"},
  "BMW":{bg1:"#0c1a2e",bg2:"#1d4ed8",accent:"#60a5fa"},
  "Mazda":{bg1:"#1f1418",bg2:"#b91c1c",accent:"#fca5a5"},
  "Nissan":{bg1:"#16213e",bg2:"#475569",accent:"#cbd5e1"}
};
var MODEL_SHAPES = {
  "Octavia":"combi","Octavia RS":"combi","Superb":"combi","Scala":"hatch",
  "Transit Custom":"van","Sprinter „PIPI“":"truck","Sprinter „THOR“":"truck",
  "e-NV200":"van","Model 3":"sedan","X5":"suv","330i":"sedan",
  "CX-5":"suv","Ranger":"truck"
};
function getCarSVG(v,w,h){
  var mc=MAKE_COLORS[v.make]||{bg1:"#1e293b",bg2:"#334155",accent:"#94a3b8"};
  var shape=MODEL_SHAPES[v.model]||"sedan";
  var W=w||400,H=h||160;
  var carW=Math.round(W*0.62),carH,bodyY,roofH,roofW,roofX;
  if(shape==="sedan"||shape==="hatch"){carH=Math.round(H*0.42);bodyY=Math.round(H*0.52);roofH=Math.round(H*0.28);roofW=Math.round(carW*0.52);roofX=Math.round((W-carW)/2+carW*0.22);}
  else if(shape==="combi"){carH=Math.round(H*0.42);bodyY=Math.round(H*0.52);roofH=Math.round(H*0.28);roofW=Math.round(carW*0.62);roofX=Math.round((W-carW)/2+carW*0.12);}
  else if(shape==="suv"){carH=Math.round(H*0.46);bodyY=Math.round(H*0.48);roofH=Math.round(H*0.30);roofW=Math.round(carW*0.56);roofX=Math.round((W-carW)/2+carW*0.18);}
  else{carH=Math.round(H*0.52);bodyY=Math.round(H*0.44);roofH=Math.round(H*0.22);roofW=Math.round(carW*0.5);roofX=Math.round((W-carW)/2+carW*0.15);}
  var cx=(W-carW)/2,cy=bodyY,r=Math.round(carH*0.18);
  var wR=Math.round(carH*0.26),w1x=Math.round(cx+carW*0.18),w2x=Math.round(cx+carW*0.72),wy=Math.round(bodyY+carH-wR*0.4);
  var windH=Math.round(roofH*0.75),windW=Math.round(roofW*0.38);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
    +'<defs><linearGradient id="bg'+v.id+'" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:'+mc.bg1+'"/><stop offset="100%" style="stop-color:'+mc.bg2+'"/></linearGradient>'
    +'<linearGradient id="car'+v.id+'" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#c8d4e8"/><stop offset="100%" style="stop-color:#8fa3c0"/></linearGradient>'
    +'<filter id="sh'+v.id+'"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/></filter>'
    +'</defs>'
    +'<rect width="'+W+'" height="'+H+'" fill="url(#bg'+v.id+')"/>'
    +'<rect x="0" y="'+Math.round(H*0.68)+'" width="'+W+'" height="'+Math.round(H*0.32)+'" fill="rgba(0,0,0,0.25)"/>'
    +'<g filter="url(#sh'+v.id+')">'
    +'<rect x="'+cx+'" y="'+cy+'" width="'+carW+'" height="'+carH+'" rx="'+r+'" fill="url(#car'+v.id+')"/>'
    +'<path d="M'+roofX+' '+bodyY+' Q'+(roofX+roofW*0.08)+' '+(bodyY-roofH)+' '+(roofX+roofW*0.2)+' '+(bodyY-roofH)+' L'+(roofX+roofW*0.8)+' '+(bodyY-roofH)+' Q'+(roofX+roofW*0.92)+' '+(bodyY-roofH)+' '+(roofX+roofW)+' '+bodyY+' Z" fill="url(#car'+v.id+')"/>'
    +'<rect x="'+(roofX+roofW*0.08)+'" y="'+(bodyY-roofH+4)+'" width="'+windW+'" height="'+windH+'" rx="3" fill="rgba(150,210,255,0.6)"/>'
    +'<rect x="'+(roofX+roofW*0.52)+'" y="'+(bodyY-roofH+4)+'" width="'+windW+'" height="'+windH+'" rx="3" fill="rgba(150,210,255,0.6)"/>'
    +'<circle cx="'+w1x+'" cy="'+wy+'" r="'+wR+'" fill="#1e293b"/><circle cx="'+w1x+'" cy="'+wy+'" r="'+Math.round(wR*0.55)+'" fill="#475569"/><circle cx="'+w1x+'" cy="'+wy+'" r="'+Math.round(wR*0.2)+'" fill="#94a3b8"/>'
    +'<circle cx="'+w2x+'" cy="'+wy+'" r="'+wR+'" fill="#1e293b"/><circle cx="'+w2x+'" cy="'+wy+'" r="'+Math.round(wR*0.55)+'" fill="#475569"/><circle cx="'+w2x+'" cy="'+wy+'" r="'+Math.round(wR*0.2)+'" fill="#94a3b8"/>'
    +'<rect x="'+(cx+carW*0.75)+'" y="'+(cy+carH*0.15)+'" width="'+(carW*0.12)+'" height="'+(carH*0.22)+'" rx="3" fill="rgba(255,220,100,0.9)"/>'
    +'<rect x="'+(cx+carW*0.04)+'" y="'+(cy+carH*0.15)+'" width="'+(carW*0.1)+'" height="'+(carH*0.22)+'" rx="3" fill="rgba(255,80,80,0.8)"/>'
    +'</g>'
    +'<text x="'+Math.round(W*0.06)+'" y="'+Math.round(H*0.2)+'" font-family="system-ui,sans-serif" font-weight="800" font-size="'+Math.round(H*0.12)+'px" fill="rgba(255,255,255,0.9)">'+v.make+'</text>'
    +'<text x="'+Math.round(W*0.06)+'" y="'+Math.round(H*0.33)+'" font-family="system-ui,sans-serif" font-weight="500" font-size="'+Math.round(H*0.10)+'px" fill="rgba(255,255,255,0.6)">'+v.model+'</text>'
    +'</svg>';
}
function getVPhotoEl(v,cls,h){
  var H=h||160;
  return '<img src="'+getEffectivePhoto(v)+'" loading="lazy" onerror="photoFallback(this,'+v.id+')" style="width:100%;height:'+H+'px;object-fit:cover;display:block;background:#e8e4de;border-radius:10px;" class="'+(cls||"")+'">';
}
function photoFallback(img,vid){
  var v=null;
  for(var i=0;i<VEHICLES.length;i++){ if(VEHICLES[i].id===vid){ v=VEHICLES[i]; break; } }
  if(!v){ img.style.display="none"; return; }
  var svg=getCarSVG(v,420,parseInt(img.style.height)||160);
  img.onerror=null;
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
}

// ===================================================================
// VLASTNÉ FOTOGRAFIE VOZIDIEL (localStorage, kľúč vehicle_photo_<id>)
// ===================================================================
function getCustomPhoto(vehicleId){
  try { return localStorage.getItem("vehicle_photo_"+vehicleId); }
  catch(e){ return null; }
}
function getEffectivePhoto(v){
  return getCustomPhoto(v.id)||v.photo;
}
function triggerPhotoUpload(vehicleId){
  var input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){
      alert("Fotografia je príliš veľká. Maximum je 2 MB.");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        localStorage.setItem("vehicle_photo_"+vehicleId, ev.target.result);
      } catch(err){
        alert("Nepodarilo sa uložiť fotografiu – úložisko prehliadača je plné.");
        return;
      }
      // Obnov detail panel (ak je otvorený) a miniatúru v tabuľke
      if(detailType==="vehicle"&&detailId===vehicleId) openVehicleDetail(vehicleId);
      var thumb = document.getElementById("vthumb-"+vehicleId);
      if(thumb) thumb.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function removeCustomPhoto(vehicleId){
  try { localStorage.removeItem("vehicle_photo_"+vehicleId); } catch(e){}
  if(detailType==="vehicle"&&detailId===vehicleId) openVehicleDetail(vehicleId);
  var v = VEHICLES.find(function(vv){return vv.id===vehicleId;});
  var thumb = document.getElementById("vthumb-"+vehicleId);
  if(thumb&&v) thumb.src = v.photo;
}

var COST_CENTERS = ["Logistika (MSK)","Manažment (Eshopy + KK)","Kníhkaviarne (KK)"];
var LOCATIONS = ["Martin HQ","Sklad Logistika","OC Cubicon BA","OC Urban Košice","OC Centro Nitra","OC MAX Trenčín","OC Kaufland BB","OC Aupark Žilina","Rezerva"];

function plusYears(n){
  var d = new Date();
  d.setFullYear(d.getFullYear()+n);
  return d.toISOString().slice(0,10);
}
function readEdits(key){
  try { return JSON.parse(localStorage.getItem(key))||{}; }
  catch(e){ return {}; }
}
function writeEdits(key,obj){
  try { localStorage.setItem(key,JSON.stringify(obj)); } catch(e){}
}
function applyPatch(target,patch){
  Object.keys(patch).forEach(function(k){ target[k]=patch[k]; });
}
function saveVehicleEdit(id,patch){
  var v = VEHICLES.find(function(x){return x.id===id;});
  if(!v) return;
  applyPatch(v,patch);
  var key = "vehicle_edits_"+id;
  var cur = readEdits(key);
  applyPatch(cur,patch);
  writeEdits(key,cur);
}
function saveDriverEdit(id,patch){
  var d = DRIVERS.find(function(x){return x.id===id;});
  if(!d) return;
  applyPatch(d,patch);
  var key = "driver_edits_"+id;
  var cur = readEdits(key);
  applyPatch(cur,patch);
  writeEdits(key,cur);
}
function applyStoredEdits(){
  VEHICLES.forEach(function(v){ applyPatch(v,readEdits("vehicle_edits_"+v.id)); });
  DRIVERS.forEach(function(d){ applyPatch(d,readEdits("driver_edits_"+d.id)); });
  try {
    var am = JSON.parse(localStorage.getItem("vehicle_authorized"));
    if(am) Object.keys(am).forEach(function(k){ VEHICLE_AUTHORIZED[k]=am[k]; });
  } catch(e){}
}
function refreshApp(){
  buildNav();
  var active = document.querySelector(".fleet-section.active");
  if(active) renderSection(active.id.replace("sec-",""));
}

// Rozbaľovacia ponuka pre lokalitu / nákladové stredisko v detaile vozidla

// Obnovenie termínov (STK / EK / poistenie / VP / školenie)
function toggleRenew(fid){
  var el = document.getElementById(fid);
  if(el) el.style.display = el.style.display==="none"?"flex":"none";
}
function saveRenew(entity,id,field){
  var inp = document.getElementById("renew-"+entity+"-"+id+"-"+field+"-date");
  var val = inp?inp.value:"";
  if(!val){ alert("Vyberte nový dátum platnosti."); return; }
  var patch = {};
  patch[field] = val;
  if(entity==="vehicle"){
    saveVehicleEdit(id,patch);
    refreshApp();
    openVehicleDetail(id,"vterminy");
  } else {
    if(field==="trainingExp") patch.trainingValid = true;
    saveDriverEdit(id,patch);
    refreshApp();
    openDriverDetail(id,"dterminy");
  }
}
function markAuthorized(id){
  saveDriverEdit(id,{authorized:true});
  refreshApp();
  openDriverDetail(id,"dterminy");
}
function markTrainingValid(id){
  saveDriverEdit(id,{trainingValid:true,trainingExp:plusYears(1)});
  refreshApp();
  openDriverDetail(id,"dterminy");
}

// ===================================================================
// PRIMÁRNE PRIRADENIE VOZIDLO ↔ VODIČ (obojstranná synchronizácia)
// ===================================================================
function setPrimaryAssignment(vehicleId,driverId){
  var d = DRIVERS.find(function(x){return x.id===driverId;});
  // vodičovi odpoj jeho doterajšie vozidlo
  if(d&&d.vehicleId&&d.vehicleId!==vehicleId){
    var oldV = VEHICLES.find(function(x){return x.id===d.vehicleId;});
    if(oldV&&oldV.driverId===driverId) saveVehicleEdit(oldV.id,{driverId:null});
  }
  // vozidlu odpoj doterajšieho vodiča
  var v = VEHICLES.find(function(x){return x.id===vehicleId;});
  if(v&&v.driverId&&v.driverId!==driverId){
    var oldD = DRIVERS.find(function(x){return x.id===v.driverId;});
    if(oldD) saveDriverEdit(oldD.id,{vehicleId:null});
  }
  saveVehicleEdit(vehicleId,{driverId:driverId});
  saveDriverEdit(driverId,{vehicleId:vehicleId});
  // primárny vodič už nemusí byť v zozname oprávnených toho istého vozidla
  if(VEHICLE_AUTHORIZED[vehicleId]&&VEHICLE_AUTHORIZED[vehicleId].indexOf(driverId)>=0){
    VEHICLE_AUTHORIZED[vehicleId]=VEHICLE_AUTHORIZED[vehicleId].filter(function(x){return x!==driverId;});
    saveAuthorizedMap();
  }
}
function changeDriverVehicle(driverId,val){
  var d = DRIVERS.find(function(x){return x.id===driverId;});
  if(!d) return;
  var vid = val?parseInt(val,10):null;
  if(!vid){
    if(d.vehicleId){
      var oldV = VEHICLES.find(function(x){return x.id===d.vehicleId;});
      if(oldV&&oldV.driverId===driverId) saveVehicleEdit(oldV.id,{driverId:null});
      saveDriverEdit(driverId,{vehicleId:null});
    }
  } else {
    setPrimaryAssignment(vid,driverId);
  }
  refreshApp();
  openDriverDetail(driverId);
}
function changeVehicleDriver(vehicleId,val){
  var v = VEHICLES.find(function(x){return x.id===vehicleId;});
  if(!v) return;
  var did = val?parseInt(val,10):null;
  if(!did){
    if(v.driverId){
      var oldD = DRIVERS.find(function(x){return x.id===v.driverId;});
      if(oldD) saveDriverEdit(oldD.id,{vehicleId:null});
      saveVehicleEdit(vehicleId,{driverId:null});
    }
  } else {
    setPrimaryAssignment(vehicleId,did);
  }
  refreshApp();
  openVehicleDetail(vehicleId);
}

function saveAuthorizedMap(){

}
function addAuthorizedDriver(vehicleId){
  var sel = document.getElementById("auth-add-driver-"+vehicleId);
  if(!sel||!sel.value) return;
  var did = parseInt(sel.value,10);
  if(!VEHICLE_AUTHORIZED[vehicleId]) VEHICLE_AUTHORIZED[vehicleId]=[];
  if(VEHICLE_AUTHORIZED[vehicleId].indexOf(did)<0) VEHICLE_AUTHORIZED[vehicleId].push(did);
  saveAuthorizedMap();
  openVehicleDetail(vehicleId,"vvodici");
}

  if(!VEHICLE_AUTHORIZED[vehicleId]) return;
  VEHICLE_AUTHORIZED[vehicleId]=VEHICLE_AUTHORIZED[vehicleId].filter(function(x){return x!==driverId;});
  saveAuthorizedMap();
  openVehicleDetail(vehicleId,"vvodici");
}
function addAuthorizedVehicle(driverId){
  var sel = document.getElementById("auth-add-vehicle-"+driverId);
  if(!sel||!sel.value) return;

  openDriverDetail(driverId,"dvozidla");

  openDriverDetail(driverId,"dvozidla");

function getServiceRecords(){
  try {
    var stored = JSON.parse(localStorage.getItem("fleet_service_records")||"[]");
    var all = SERVICE_RECORDS_DEFAULT.concat(stored);
    all.sort(function(a,b){ return b.date.localeCompare(a.date); });
    return all;
  } catch(e){ return SERVICE_RECORDS_DEFAULT.slice(); }
}
function addServiceRecord(record){
  try {
    var stored = JSON.parse(localStorage.getItem("fleet_service_records")||"[]");
    record.id = "sr_"+Date.now();
    record.createdAt = new Date().toISOString().slice(0,10);
    stored.push(record);
    localStorage.setItem("fleet_service_records",JSON.stringify(stored));
    return true;
  } catch(e){ return false; }
}
function deleteServiceRecord(id){
  try {
    var stored = JSON.parse(localStorage.getItem("fleet_service_records")||"[]");
    stored = stored.filter(function(r){ return r.id!==id; });
    localStorage.setItem("fleet_service_records",JSON.stringify(stored));
    localStorage.removeItem("fleet_receipt_"+id);
    return true;
  } catch(e){ return false; }
}

// ===================================================================
// DÁTA – DOKUMENTY VOZIDIEL (checklist + Google Drive URL + prílohy)
// localStorage kľúče: fleet_drive_url_<id>, fleet_doc_check_<id>,
// fleet_doc_note_<id>, fleet_doc_files_<id>
// ===================================================================
var DOC_CHECKLIST = [
  {key:"tp",            label:"Technický preukaz (TP)",   critical:true},
  {key:"insurance",     label:"Poistná zmluva",           critical:true},
  {key:"stk_protocol",  label:"STK protokol",             critical:true},
  {key:"authorization", label:"Splnomocnenie",            critical:true},
  {key:"purchase",      label:"Kúpna zmluva / TP karta",  critical:false},
  {key:"lease",         label:"Leasing / úverová zmluva", critical:false}
];

function getDriveUrl(vehicleId){
  try { return localStorage.getItem("fleet_drive_url_"+vehicleId)||""; }
  catch(e){ return ""; }
}
function saveDriveUrl(vehicleId,url){
  try {
    if(url) localStorage.setItem("fleet_drive_url_"+vehicleId,url);
    else localStorage.removeItem("fleet_drive_url_"+vehicleId);
  } catch(e){}
}
function getDocCheck(vehicleId){
  try { return JSON.parse(localStorage.getItem("fleet_doc_check_"+vehicleId)||"{}"); }
  catch(e){ return {}; }
}
function toggleDocCheck(vehicleId,key){
  var c = getDocCheck(vehicleId);
  c[key] = !c[key];
  try { localStorage.setItem("fleet_doc_check_"+vehicleId,JSON.stringify(c)); } catch(e){}
}
function getDocNote(vehicleId){
  try { return localStorage.getItem("fleet_doc_note_"+vehicleId)||""; }
  catch(e){ return ""; }
}
function saveDocNote(vehicleId,text){
  try { localStorage.setItem("fleet_doc_note_"+vehicleId,text); } catch(e){}
}
function getDocFiles(vehicleId){
  try { return JSON.parse(localStorage.getItem("fleet_doc_files_"+vehicleId)||"[]"); }
  catch(e){ return []; }
}
function addDocFile(vehicleId,fileObj){
  var files = getDocFiles(vehicleId);
  fileObj.id = "df_"+Date.now();
  fileObj.uploadedAt = new Date().toISOString().slice(0,10);
  files.push(fileObj);
  try {
    localStorage.setItem("fleet_doc_files_"+vehicleId,JSON.stringify(files));
    return true;
  } catch(e){
    alert("Súbor je príliš veľký – úložisko prehliadača je plné. Pre veľké dokumenty použite Google Drive.");
    return false;
  }
}
function deleteDocFile(vehicleId,fileId){
  var files = getDocFiles(vehicleId).filter(function(f){ return f.id!==fileId; });
  try { localStorage.setItem("fleet_doc_files_"+vehicleId,JSON.stringify(files)); } catch(e){}
}
// Kompletnosť povinných dokumentov vozidla (0–100 %)
function docCompleteness(vehicleId){
  var check = getDocCheck(vehicleId);
  var critical = DOC_CHECKLIST.filter(function(d){ return d.critical; });
  var done = critical.filter(function(d){ return check[d.key]; }).length;
  return Math.round(done/critical.length*100);
}

  {key:"fuelcards",   label:function(){return "Palivové karty ("+FUEL_CARDS.length+")";},icon:"far fa-credit-card"},

function buildNav(){
  var ac = buildAlerts().length;
  document.getElementById("nav").innerHTML = SECTIONS.map(function(s){
    var b = s.key==="alerts" && ac>0 ? '<span class="nav-badge">'+ac+'</span>' : "";
    return '<button type="button" class="nav-btn" id="nav-'+s.key+'" onclick="goTo(\''+s.key+'\')"><i class="'+s.icon+'"></i><span>'+s.label()+'</span>'+b+'</button>';
  }).join("");
}

function goTo(key){
  document.querySelectorAll(".fleet-section").forEach(function(el){ el.classList.remove("active"); });
  document.getElementById("sec-"+key).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(function(el){ el.classList.remove("active"); });
  document.getElementById("nav-"+key).classList.add("active");
  closeDetail();
  renderSection(key);
}

function renderSection(key){
  if(key==="dashboard") renderDashboard();
  else if(key==="vehicles") renderVehicles();
  else if(key==="drivers") renderDrivers();
  else if(key==="trips") renderTrips();
  else if(key==="maintenance") renderMaintenance();
  else if(key==="service") renderServiceHistory();
  else if(key==="documents") renderDocuments();
  else if(key==="fuelcards") renderFuelCards();
  else if(key==="alerts") renderAlerts();
}

var EVENT_COLS = {"Servis":"#2563eb","Oprava":"#e63f2a","STK":"#16a34a","Poistenie":"#f97316"};
var CC_COLS = {"Logistika (MSK)":"#2563eb","Manažment (Eshopy + KK)":"#7c3aed","Kníhkaviarne (KK)":"#e63f2a"};

// ===================================================================
// WIDGET „BLÍŽI SA TERMÍN“ (STK, poistenie, známky, VP – horizont 60 dní)
// ===================================================================
function deadlineCol(d){
  return d<0?"#ef4444":d<=14?"#f97316":d<=30?"#eab308":"#22c55e";
}
function getDoneMap(){
  try { return JSON.parse(localStorage.getItem("deadline_done"))||{}; }
  catch(e){ return {}; }
}
function buildDeadlines(horizon){
  var H = horizon||60;
  var done = getDoneMap();
  var items = [];
  VEHICLES.forEach(function(v){
    var title = v.spz+" "+v.make+" "+v.model;
    var sd = daysTo(v.stk);
    if(sd<=H) items.push({key:"stk|"+v.id+"|"+v.stk,icon:"far fa-car",title:title,label:"STK",date:v.stk,days:sd,vid:v.id});
    var pd = daysTo(v.insurance);
    if(pd<=H) items.push({key:"poistenie|"+v.id+"|"+v.insurance,icon:"far fa-umbrella",title:title,label:"Poistenie",date:v.insurance,days:pd,vid:v.id});
    v.vignettes.forEach(function(c){
      var exp = (v.vignetteExp&&v.vignetteExp[c])||VIGN_EXPIRY[c];
      var vd = daysTo(exp);
      if(vd<=H) items.push({key:"znamka"+c+"|"+v.id+"|"+exp,icon:"far fa-road",title:title,label:"Diaľničná známka "+c,date:exp,days:vd,vid:v.id});
    });
  });
  DRIVERS.forEach(function(d){
    var ld = daysTo(d.licenseExp);
    if(ld<=H) items.push({key:"vp|"+d.id+"|"+d.licenseExp,icon:"far fa-id-card",title:d.name,label:"Platnosť VP",date:d.licenseExp,days:ld,did:d.id});
  });
  items = items.filter(function(it){ return !done[it.key]; });
  items.sort(function(a,b){ return a.days-b.days; });
  return items;
}
function deadlineRowHtml(it,hidden){
  var col = deadlineCol(it.days);
  var click = it.vid?"openVehicleDetail("+it.vid+")":"openDriverDetail("+it.did+")";
  return '<div class="deadline-row'+(hidden?' dl-extra':'')+'"'+(hidden?' style="display:none;"':'')
    +' data-key="'+it.key+'" onclick="'+click+'">'
    +'<span class="dl-icon" style="background:'+col+'18;color:'+col+';"><i class="'+it.icon+'"></i></span>'
    +'<div style="flex:1;min-width:0;"><div style="font-weight:700;">'+it.title+'</div>'
    +'<div style="font-size:11px;color:#999;margin-top:1px;">'+it.label+' &middot; '+fmtDate(it.date)+'</div></div>'
    +chipHtml(it.days<0?'expir.':it.days+'d',col)
    +'<button type="button" class="dl-done-btn" title="Označiť ako vybavené" onclick="event.stopPropagation();markDeadlineDone(this);"><i class="far fa-check"></i></button>'
    +'</div>';
}
function deadlineWidgetHtml(){
  var items = buildDeadlines(60);
  var rowsHtml = items.map(function(it,i){ return deadlineRowHtml(it,i>=5); }).join("");
  return '<div class="widget" id="deadline-widget" style="margin-bottom:14px;">'
    +'<div class="widget-title" style="display:flex;align-items:center;gap:8px;">Blíži sa termín'
    +'<span style="font-weight:400;color:#999;font-size:12px;">(60 dní)</span>'
    +'<span class="wcount" id="dl-count">'+items.length+'</span></div>'
    +(items.length?rowsHtml:'<div style="font-size:12px;color:#16a34a;font-weight:600;">Žiadne termíny v najbližších 60 dňoch</div>')
    +(items.length>5?'<button type="button" class="dl-toggle" onclick="toggleDeadlines(this)">Zobraziť všetky ('+items.length+')</button>':'')
    +'</div>';
}
function markDeadlineDone(btn){
  var row = btn.closest(".deadline-row");
  if(!row) return;
  var map = getDoneMap();
  map[row.getAttribute("data-key")] = true;
  try { localStorage.setItem("deadline_done",JSON.stringify(map)); } catch(e){}
  row.style.opacity = "0";
  setTimeout(function(){
    row.remove();
    var left = document.querySelectorAll("#deadline-widget .deadline-row").length;
    var cnt = document.getElementById("dl-count");
    if(cnt) cnt.textContent = left;
  },400);
}
function toggleDeadlines(btn){
  var rows = document.querySelectorAll("#deadline-widget .dl-extra");
  var show = btn.getAttribute("data-open")!=="1";
  rows.forEach(function(r){ r.style.display = show?"flex":"none"; });
  btn.setAttribute("data-open",show?"1":"0");
  btn.textContent = show?"Zobraziť menej":"Zobraziť všetky ("+document.querySelectorAll("#deadline-widget .deadline-row").length+")";
}

// KPI modal – idx: 0=všetky, 1=aktívne, 2=servis, 3=urgentné
function openKpiModal(idx){
  var configs = [
    {filter:"all",     title:"Všetky vozidlá"},
    {filter:"aktivne", title:"Aktívne vozidlá"},
    {filter:"servis",  title:"Vozidlá v servise"},
    {filter:"urgent",  title:"Vyžadujú pozornosť"}
  ];
  var cfg = configs[idx]||configs[0];
  var vs = VEHICLES.filter(function(v){
    if(cfg.filter==="all") return true;
    if(cfg.filter==="aktivne") return v.status==="aktivne";
    if(cfg.filter==="servis") return v.status==="servis";
    if(cfg.filter==="urgent") return daysTo(v.stk)<=30||daysTo(v.insurance)<=30||kmLeft(v)<=5000;
    return true;
  });
  document.getElementById("kpi-modal-title").textContent = cfg.title+" ("+vs.length+")";
  var rows = vs.map(function(v){
    var dr = DRIVERS.find(function(d){return d.id===v.driverId;});
    var sd = daysTo(v.stk), kl = kmLeft(v);
    return '<tr onclick="closeKpiModal();openVehicleDetail('+v.id+')" style="cursor:pointer;">'
      +'<td><span class="vstatus-dot" style="background:'+statusCol(v.status)+';"></span>'
      +'<strong>'+v.spz+'</strong> '+v.make+' '+v.model+'</td>'
      +'<td>'+v.km.toLocaleString("sk")+' km</td>'
      +'<td>'+chipHtml('STK:'+(sd<0?'expir.':sd+'d'),urgCol(sd))+'</td>'
      +'<td>'+chipHtml(kl<=0?'SERVIS!':'+'+kl.toLocaleString('sk')+'km',kl<=0?'#ef4444':kl<=5000?'#f97316':'#22c55e')+'</td>'
      +'<td style="font-size:12px;color:#888;">'+v.location+'</td>'
      +'<td style="font-size:12px;color:#888;">'+(dr?dr.name:'-')+'</td>'
      +'</tr>';
  }).join("");
  document.getElementById("kpi-modal-rows").innerHTML = rows||'<tr><td colspan="6" style="color:#aaa;text-align:center;padding:20px;">Žiadne vozidlá</td></tr>';
  document.getElementById("kpi-modal").classList.add("open");
}
function closeKpiModal(){

// ===================================================================
// VOZIDLÁ – tabuľkový zoznam
// ===================================================================
function renderVehicles(){
  var q = fold(vehicleSearch.toLowerCase());
  var filtered = VEHICLES.filter(function(v){
    var ms = vehicleFilter==="all"||v.status===vehicleFilter
      ||(vehicleFilter==="assigned"&&v.driverId)
      ||(vehicleFilter==="unassigned"&&!v.driverId);
    var mc = ccFilter==="all"||v.costCenter===ccFilter;
    var mq = !q||[v.make,v.model,v.spz,v.location,v.costCenter].some(function(s){
      return fold((s||"").toLowerCase()).indexOf(q)>=0;
    });
    return ms&&mc&&mq;
  });

  function tabBtn(key,label){
    return '<button type="button" class="vtab'+(vehicleFilter===key?' active':'')
      +'" onclick="vehicleFilter=\''+key+'\';renderVehicles();">'+label+'</button>';
  }
  function ccOpt(val,label){
    return '<option value="'+val+'"'+(ccFilter===val?' selected':'')+'>'+label+'</option>';
  }

  var rows = filtered.map(function(v){
    var dr = DRIVERS.find(function(d){return d.id===v.driverId;});
    var sd = daysTo(v.stk), kl = kmLeft(v);
    return '<tr onclick="openVehicleDetail('+v.id+')" style="cursor:pointer;">'
      +'<td style="width:64px;"><img id="vthumb-'+v.id+'" class="vthumb" src="'+getEffectivePhoto(v)+'" loading="lazy" onerror="photoFallback(this,'+v.id+')"></td>'
      +'<td><strong>'+v.spz+'</strong></td>'
      +'<td>'+v.year+'</td>'
      +'<td>'+v.make+'</td>'
      +'<td>'+v.model+'</td>'
      +'<td><span class="vstatus-dot" style="background:'+statusCol(v.status)+';"></span>'+statusLabel(v.status)+'</td>'
      +'<td>'+fuelLabel(v.fuel)+'</td>'
      +'<td style="font-size:12px;color:#666;">'+(v.costCenter||'&mdash;')+'</td>'
      +'<td style="font-size:12px;color:#888;">'+v.location+'</td>'
      +'<td style="white-space:nowrap;">'+v.km.toLocaleString("sk")+' km</td>'
      +'<td>'+chipHtml('STK:'+(sd<0?'expir.':sd+'d'),urgCol(sd))+'</td>'
      +'<td>'+chipHtml(kl<=0?'SERVIS!':'+'+kl.toLocaleString('sk')+'km',kl<=0?'#ef4444':kl<=5000?'#f97316':'#22c55e')+'</td>'
      +'<td style="font-size:12px;color:#888;">'+(dr?dr.name:'<span style="color:#f97316;font-weight:600;">Nepriradené</span>')+'</td>'
      +'</tr>';
  }).join('');

  document.getElementById('sec-vehicles').innerHTML = ''
    +'<div class="fleet-sh"><h2>Vozidlá</h2>'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="alert(\'Funkcia pridania vozidla bude dostupná v plnej verzii.\')"><i class="far fa-plus" style="margin-right:6px;"></i>Pridať vozidlo</button></div>'

    +'<div class="vtabs">'
    +tabBtn('all','Všetky')
    +tabBtn('aktivne','Aktívne')
    +tabBtn('servis','V servise')
    +tabBtn('assigned','Priradené')
    +tabBtn('unassigned','Nepriradené')
    +'</div>'

    +'<div class="vfilter-row">'
    +'<input class="fleet-search" placeholder="Hľadať SPZ, model, lokalitu, stredisko..." value="'+vehicleSearch.replace(/"/g,'&quot;')+'" oninput="vehicleSearch=this.value;renderVehicles();">'
    +'<select class="vselect" onchange="vehicleFilter=this.value;renderVehicles();">'
    +'<option value="all"'+(vehicleFilter==='all'?' selected':'')+'>Stav: všetky</option>'
    +'<option value="aktivne"'+(vehicleFilter==='aktivne'?' selected':'')+'>Aktívne</option>'
    +'<option value="servis"'+(vehicleFilter==='servis'?' selected':'')+'>V servise</option>'
    +'<option value="neaktivne"'+(vehicleFilter==='neaktivne'?' selected':'')+'>Neaktívne</option>'
    +'</select>'
    +'<select class="vselect" onchange="ccFilter=this.value;renderVehicles();">'
    +ccOpt('all','Nákladové stredisko: všetky')
    +ccOpt('Logistika (MSK)','Logistika (MSK)')
    +ccOpt('Manažment (Eshopy + KK)','Manažment (Eshopy + KK)')
    +ccOpt('Kníhkaviarne (KK)','Kníhkaviarne (KK)')
    +'</select>'
    +'<span class="vcount-info">1&ndash;'+filtered.length+' z '+VEHICLES.length+' vozidiel</span>'
    +'</div>'

    +'<div class="vtable-wrap"><table class="fleet-table">'
    +'<thead><tr><th></th><th>SPZ</th><th>Rok</th><th>Značka</th><th>Model</th><th>Stav</th><th>Palivo</th><th>Nákl. stredisko</th><th>Lokalita</th><th>Nájazd</th><th>STK</th><th>Do servisu</th><th>Vodič</th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="13" style="text-align:center;color:#aaa;padding:24px;">Žiadne vozidlá nezodpovedajú filtru</td></tr>')+'</tbody>'
    +'</table></div>';
}

function dpTab(tabId,btn){
  document.querySelectorAll("#dp-body > div").forEach(function(el){ el.style.display="none"; });
  var t = document.getElementById(tabId);
  if(t) t.style.display="block";
  document.querySelectorAll("#dp-tabs .dp-tab-btn").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}

function dpActivate(tabId){
  document.querySelectorAll("#dp-body > div").forEach(function(el){ el.style.display="none"; });
  var t = document.getElementById(tabId);
  if(t) t.style.display="block";
  document.querySelectorAll("#dp-tabs .dp-tab-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-tab")===tabId);
  });
}

function closeDetail(){
  document.getElementById("detail-panel").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  detailType=null; detailId=null;
}
// ===================================================================
// FAKTÚRY VOZIDLA (záložka detailu, drag & drop)
// ===================================================================
function getInvoices(vehicleId){ return INVOICES[vehicleId]||[]; }
function addInvoice(vehicleId,inv){
  if(!INVOICES[vehicleId]) INVOICES[vehicleId]=[];
  INVOICES[vehicleId].push(inv);
}
function removeInvoice(vehicleId,invId){
  if(!INVOICES[vehicleId]) return;
  INVOICES[vehicleId]=INVOICES[vehicleId].filter(function(i){return i.id!==invId;});
}
function invIconClass(ext){ return ext==="pdf"?"pdf":["jpg","jpeg","png","gif"].indexOf(ext)>=0?"img":"other"; }
function invIconChar(ext){ return ext==="pdf"?"PDF":["jpg","jpeg","png","gif"].indexOf(ext)>=0?"IMG":"DOC"; }

function buildInvoiceTab(vehicleId){
  var invs = getInvoices(vehicleId);
  var totalEur = invs.reduce(function(s,i){return s+(i.amount||0);},0);

  var statsHtml = '<div class="dp-grid">'
    +'<div class="dp-cell"><div class="dp-cell-label">Dokumentov</div><div class="dp-cell-val" style="font-size:18px;">'+invs.length+'</div></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">Celková suma</div><div class="dp-cell-val" style="font-size:18px;color:#2563eb;">'+fmtEur(totalEur)+'</div></div>'
    +'</div>';

  var dropHtml = '<div class="drop-zone" id="drop-'+vehicleId+'" '
    +'ondragover="event.preventDefault();this.classList.add(\'drag-over\')" '
    +'ondragleave="this.classList.remove(\'drag-over\')" '
    +'ondrop="handleInvDrop(event,'+vehicleId+')" '
    +'onclick="document.getElementById(\'inv-file-'+vehicleId+'\').click()">'
    +'<div class="drop-zone-icon">&#128193;</div>'
    +'<div class="drop-zone-text">Pretiahnite súbory alebo kliknite na nahratie</div>'
    +'<div class="drop-zone-sub">PDF, JPG, PNG, DOCX &bull; max 20 MB</div>'
    +'<input type="file" id="inv-file-'+vehicleId+'" multiple accept=".pdf,.jpg,.jpeg,.png,.docx" style="display:none;" onchange="handleInvFiles(event,'+vehicleId+')">'
    +'</div>';

  var formHtml = '<div class="inv-form" id="inv-form-'+vehicleId+'">'
    +'<div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:10px;">Upresnite dokument</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">'
    +'<div><label class="fleet-label">Typ dokumentu</label>'
    +'<select id="inv-type-'+vehicleId+'" class="fleet-select">'
    +INV_TYPES.map(function(t){return '<option>'+t+'</option>';}).join("")
    +'</select></div>'
    +'<div><label class="fleet-label">Suma (EUR)</label>'
    +'<input type="number" id="inv-amount-'+vehicleId+'" placeholder="0.00" class="fleet-input"></div>'
    +'</div>'
    +'<div style="margin-bottom:8px;"><label class="fleet-label">Popis (voliteľný)</label>'
    +'<input type="text" id="inv-desc-'+vehicleId+'" placeholder="napr. Výmena bŕzd predné" class="fleet-input"></div>'
    +'<div style="display:flex;gap:6px;">'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="confirmInvAdd('+vehicleId+')">Uložiť</button>'
    +'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="cancelInvAdd('+vehicleId+')">Zrušiť</button>'
    +'</div></div>';

  var listHtml = invs.length===0
    ?'<div style="font-size:13px;color:#999;text-align:center;padding:20px 0;">Žiadne dokumenty. Nahrajte prvú faktúru.</div>'
    :invs.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(inv){
        var ic = invIconClass(inv.ext);
        return '<div class="invoice-row">'
          +'<div class="invoice-icon '+ic+'">'+invIconChar(inv.ext)+'</div>'
          +'<div class="invoice-meta">'
          +'<div class="invoice-name">'+inv.name+'</div>'
          +'<div class="invoice-detail">'+fmtDate(inv.date)+(inv.size?' &bull; '+inv.size:'')+(inv.eventDesc?' &bull; '+inv.eventDesc:'')+'</div>'
          +'</div>'
          +(inv.amount>0?'<div style="font-size:13px;font-weight:700;color:#1a1a1a;white-space:nowrap;">'+fmtEur(inv.amount)+'</div>':'')
          +'<span class="invoice-type">'+inv.type+'</span>'
          +'<button type="button" class="invoice-del" onclick="delInv('+vehicleId+','+inv.id+')" title="Odstrániť">&#215;</button>'
          +'</div>';
      }).join("");

  return statsHtml+dropHtml+formHtml+listHtml;
}

function handleInvDrop(event,vehicleId){
  event.preventDefault();
  document.getElementById("drop-"+vehicleId).classList.remove("drag-over");
  var files = event.dataTransfer.files;
  if(files&&files.length>0) processInvFile(files[0],vehicleId);
}
function handleInvFiles(event,vehicleId){
  var files = event.target.files;
  if(files&&files.length>0) processInvFile(files[0],vehicleId);
}
function processInvFile(file,vehicleId){
  _pendingInvFile = {name:file.name,size:fmtFileSize(file.size),ext:file.name.split(".").pop().toLowerCase(),date:new Date().toISOString().slice(0,10),vehicleId:vehicleId};
  var form = document.getElementById("inv-form-"+vehicleId);
  if(form) form.classList.add("open");
  var descEl = document.getElementById("inv-desc-"+vehicleId);
  if(descEl) descEl.value = file.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
}
function confirmInvAdd(vehicleId){
  if(!_pendingInvFile) return;
  INV_COUNTER++;
  var typeEl = document.getElementById("inv-type-"+vehicleId);
  var amountEl = document.getElementById("inv-amount-"+vehicleId);
  var descEl = document.getElementById("inv-desc-"+vehicleId);
  addInvoice(vehicleId,{
    id:INV_COUNTER, vehicleId:vehicleId,
    name:_pendingInvFile.name, size:_pendingInvFile.size,
    ext:_pendingInvFile.ext, date:_pendingInvFile.date,
    type:typeEl?typeEl.value:"Servisná faktúra",
    amount:amountEl?parseFloat(amountEl.value)||0:0,
    eventDesc:descEl?descEl.value:""
  });
  _pendingInvFile = null;
  var tabEl = document.getElementById("vfaktury");
  if(tabEl) tabEl.innerHTML = buildInvoiceTab(vehicleId);
}
function cancelInvAdd(vehicleId){
  _pendingInvFile = null;
  var form = document.getElementById("inv-form-"+vehicleId);
  if(form) form.classList.remove("open");
  var fileInput = document.getElementById("inv-file-"+vehicleId);
  if(fileInput) fileInput.value = "";
}
function delInv(vehicleId,invId){
  removeInvoice(vehicleId,invId);

function renderDrivers(){
  var q = fold(driverSearch.toLowerCase());
  var filtered = DRIVERS.filter(function(d){
    var mf = driverFilter==="all"
      ||(driverFilter==="primary"&&d.vehicleId!==null)
      ||(driverFilter==="auth"&&d.vehicleId===null);
    var mq = !q||[d.name,d.role,d.email].some(function(s){
      return fold((s||"").toLowerCase()).indexOf(q)>=0;
    });
    return mf&&mq;
  });

  function tabBtn(key,label){
    return '<button type="button" class="vtab'+(driverFilter===key?' active':'')
      +'" onclick="driverFilter=\''+key+'\';renderDrivers();">'+label+'</button>';
  }

  var rows = filtered.map(function(d){
    var v = VEHICLES.find(function(vv){return vv.id===d.vehicleId;});
    var authVehicles = VEHICLES.filter(function(vv){return (VEHICLE_AUTHORIZED[vv.id]||[]).indexOf(d.id)>=0;});
    var lpd = daysTo(d.licenseExp), tpd = daysTo(d.trainingExp);
    return '<tr onclick="openDriverDetail('+d.id+')" style="cursor:pointer;">'
      +'<td style="width:48px;"><img class="davatar-sm" src="'+avatarUrl(d)+'" loading="lazy" onerror="this.style.display=\'none\'"></td>'
      +'<td><strong>'+d.name+'</strong><div style="font-size:11px;color:#999;">'+d.email+'</div></td>'
      +'<td style="font-size:12px;color:#666;">'+d.role+'</td>'
      +'<td>'+(d.vehicleId?'<span class="vstatus-dot" style="background:#2563eb;"></span>Primárny':'<span class="vstatus-dot" style="background:#94a3b8;"></span>Oprávnený')+'</td>'
      +'<td>'+(d.authorized
          ?'<span class="vstatus-dot" style="background:#22c55e;"></span><span style="font-size:12px;">OK</span>'
          :'<span class="vstatus-dot" style="background:#ef4444;"></span><span style="font-size:12px;color:#ef4444;font-weight:700;">Neoprávnený</span>')+'</td>'
      +'<td>'+chipHtml(d.trainingValid&&tpd>0?(tpd>90?'OK':tpd+'d'):'expir.',d.trainingValid&&tpd>0?urgCol(tpd):'#ef4444')+'</td>'
      +'<td>'+chipHtml(lpd<0?'expir.':lpd<=90?lpd+'d':'OK',urgCol(lpd))+'</td>'
      +'<td style="font-size:12px;">'+(v?'<strong>'+v.spz+'</strong> <span style="color:#999;">'+v.make+'</span>':'<span style="color:#bbb;">&mdash;</span>')+'</td>'
      +'<td style="font-size:12px;color:#888;text-align:center;">'+(authVehicles.length?'+'+authVehicles.length:'&mdash;')+'</td>'
      +'</tr>';
  }).join('');

  document.getElementById('sec-drivers').innerHTML = ''
    +'<div class="fleet-sh"><h2>Vodiči</h2>'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="alert(\'Funkcia pridania vodiča bude dostupná v plnej verzii.\')"><i class="far fa-plus" style="margin-right:6px;"></i>Pridať vodiča</button></div>'

    +'<div class="vtabs">'
    +tabBtn('all','Všetci ('+DRIVERS.length+')')
    +tabBtn('primary','Primárni ('+DRIVERS.filter(function(d){return d.vehicleId!==null;}).length+')')
    +tabBtn('auth','Oprávnení ('+DRIVERS.filter(function(d){return d.vehicleId===null;}).length+')')
    +'</div>'

    +'<div class="vfilter-row">'
    +'<input class="fleet-search" placeholder="Hľadať meno, rolu, e-mail..." value="'+driverSearch.replace(/"/g,'&quot;')+'" oninput="driverSearch=this.value;renderDrivers();">'
    +'<span class="vcount-info">1&ndash;'+filtered.length+' z '+DRIVERS.length+' vodičov</span>'
    +'</div>'

    +'<div class="vtable-wrap"><table class="fleet-table">'
    +'<thead><tr><th></th><th>Meno</th><th>Rola</th><th>Typ</th><th>Oprávnenie</th><th>Školenie</th><th>Plat. VP</th><th>Prim. vozidlo</th><th>Opr. voz.</th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="9" style="text-align:center;color:#aaa;padding:24px;">Žiadni vodiči nezodpovedajú filtru</td></tr>')+'</tbody>'
    +'</table></div>';
}

// ===================================================================
// DOKUMENTY VODIČA (záložka detailu, drag & drop)
// ===================================================================
function getDriverDocs(driverId){ return DRIVER_DOCS[driverId]||[]; }
function addDriverDoc(driverId,doc){
  if(!DRIVER_DOCS[driverId]) DRIVER_DOCS[driverId]=[];
  DRIVER_DOCS[driverId].push(doc);
}
function removeDriverDoc(driverId,docId){
  if(!DRIVER_DOCS[driverId]) return;
  DRIVER_DOCS[driverId]=DRIVER_DOCS[driverId].filter(function(d){return d.id!==docId;});
}

var DRDOC_COLORS = {
  "Splnomocnenie":"#7c3aed",
  "Zápisnica zo školenia":"#0891b2",
  "Potvrdenie oprávnenia":"#16a34a",
  "Kópia VP":"#d97706",
  "Lekársky posudok":"#dc2626",
  "Certifikát školenia":"#0284c7",
  "Iné":"#64748b"
};

function buildDriverDocsTab(driverId){
  var docs = getDriverDocs(driverId);
  var typeCount = {};
  docs.forEach(function(d){ typeCount[d.type]=(typeCount[d.type]||0)+1; });

  var statsHtml = '<div class="dp-grid" style="grid-template-columns:1fr 1fr 1fr;">'
    +'<div class="dp-cell"><div class="dp-cell-label">Dokumentov</div><div class="dp-cell-val" style="font-size:18px;">'+docs.length+'</div></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">Splnomocnenia</div><div class="dp-cell-val" style="font-size:18px;color:#7c3aed;">'+(typeCount["Splnomocnenie"]||0)+'</div></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">Zápisnice</div><div class="dp-cell-val" style="font-size:18px;color:#0891b2;">'+(typeCount["Zápisnica zo školenia"]||0)+'</div></div>'
    +'</div>';

  var dropHtml = '<div class="drop-zone" id="drdrop-'+driverId+'" '
    +'ondragover="event.preventDefault();this.classList.add(\'drag-over\')" '
    +'ondragleave="this.classList.remove(\'drag-over\')" '
    +'ondrop="handleDrDocDrop(event,'+driverId+')" '
    +'onclick="document.getElementById(\'drfile-'+driverId+'\').click()">'
    +'<div class="drop-zone-icon">&#128196;</div>'
    +'<div class="drop-zone-text">Pretiahnite dokument alebo kliknite na nahratie</div>'
    +'<div class="drop-zone-sub">Splnomocnenia, zápisnice, certifikáty &bull; PDF, JPG, PNG, DOCX</div>'
    +'<input type="file" id="drfile-'+driverId+'" multiple accept=".pdf,.jpg,.jpeg,.png,.docx" style="display:none;" onchange="handleDrDocFiles(event,'+driverId+')">'
    +'</div>';

  var formHtml = '<div class="inv-form" id="drdoc-form-'+driverId+'">'
    +'<div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:10px;">Upresnite dokument</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">'
    +'<div><label class="fleet-label">Typ dokumentu</label>'
    +'<select id="drtype-'+driverId+'" class="fleet-select">'
    +DRDOC_TYPES.map(function(t){return '<option>'+t+'</option>';}).join("")
    +'</select></div>'
    +'<div><label class="fleet-label">Platné do</label>'
    +'<input type="date" id="drvalid-'+driverId+'" class="fleet-input"></div>'
    +'</div>'
    +'<div style="margin-bottom:8px;"><label class="fleet-label">Poznámka (voliteľná)</label>'
    +'<input type="text" id="drnote-'+driverId+'" placeholder="napr. Školenie BOZP + firemné vozidlá" class="fleet-input"></div>'
    +'<div style="display:flex;gap:6px;">'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="confirmDrDoc('+driverId+')">Uložiť</button>'
    +'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="cancelDrDoc('+driverId+')">Zrušiť</button>'
    +'</div></div>';

  var listHtml = docs.length===0
    ?'<div style="font-size:13px;color:#999;text-align:center;padding:20px 0;">Žiadne dokumenty. Nahrajte splnomocnenie alebo zápisnicu.</div>'
    :docs.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(doc){
        var col = DRDOC_COLORS[doc.type]||"#64748b";
        var ic = invIconClass(doc.ext);
        var expDays = doc.validTo?daysTo(doc.validTo):null;
        var expChip = expDays!==null
          ?'<span style="font-size:10px;font-weight:700;color:'+urgCol(expDays)+';background:'+urgCol(expDays)+'14;border:1px solid '+urgCol(expDays)+'30;border-radius:4px;padding:2px 7px;white-space:nowrap;">'+(expDays<0?'expir.':expDays+'d')+'</span>'
          :'';
        return '<div class="invoice-row">'
          +'<div class="invoice-icon '+ic+'">'+invIconChar(doc.ext)+'</div>'
          +'<div class="invoice-meta">'
          +'<div class="invoice-name">'+doc.name+'</div>'
          +'<div class="invoice-detail">'+fmtDate(doc.date)+(doc.size?' &bull; '+doc.size:'')+(doc.validTo?' &bull; platné do '+fmtDate(doc.validTo):'')+(doc.note?' &bull; '+doc.note:'')+'</div>'
          +'</div>'
          +expChip
          +'<span class="invoice-type" style="background:'+col+'14;color:'+col+';border:1px solid '+col+'30;">'+doc.type+'</span>'
          +'<button type="button" class="invoice-del" onclick="delDrDoc('+driverId+','+doc.id+')" title="Odstrániť">&#215;</button>'
          +'</div>';
      }).join("");

  return statsHtml+dropHtml+formHtml+listHtml;
}

function handleDrDocDrop(event,driverId){
  event.preventDefault();
  document.getElementById("drdrop-"+driverId).classList.remove("drag-over");
  var files = event.dataTransfer.files;
  if(files&&files.length>0) processDrDocFile(files[0],driverId);
}
function handleDrDocFiles(event,driverId){
  var files = event.target.files;
  if(files&&files.length>0) processDrDocFile(files[0],driverId);
}
function processDrDocFile(file,driverId){
  _pendingDrDoc = {name:file.name,size:fmtFileSize(file.size),ext:file.name.split(".").pop().toLowerCase(),date:new Date().toISOString().slice(0,10),driverId:driverId};
  var form = document.getElementById("drdoc-form-"+driverId);
  if(form) form.classList.add("open");
  var noteEl = document.getElementById("drnote-"+driverId);
  if(noteEl) noteEl.value = file.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
  // Auto-detekcia typu z názvu súboru
  var typeEl = document.getElementById("drtype-"+driverId);
  if(typeEl){
    var fn = fold(file.name.toLowerCase());
    if(fn.indexOf("splnomocnen")>=0) typeEl.value="Splnomocnenie";
    else if(fn.indexOf("zapisnic")>=0||fn.indexOf("skolen")>=0) typeEl.value="Zápisnica zo školenia";
    else if(fn.indexOf("certifik")>=0) typeEl.value="Certifikát školenia";
    else if(fn.indexOf("lekarsk")>=0||fn.indexOf("posudok")>=0) typeEl.value="Lekársky posudok";
    else if(fn.indexOf("opravnen")>=0||fn.indexOf("potvrden")>=0) typeEl.value="Potvrdenie oprávnenia";
  }
}
function confirmDrDoc(driverId){
  if(!_pendingDrDoc) return;
  DRDOC_COUNTER++;
  var typeEl = document.getElementById("drtype-"+driverId);
  var validEl = document.getElementById("drvalid-"+driverId);
  var noteEl = document.getElementById("drnote-"+driverId);
  addDriverDoc(driverId,{
    id:DRDOC_COUNTER, driverId:driverId,
    name:_pendingDrDoc.name, size:_pendingDrDoc.size,
    ext:_pendingDrDoc.ext, date:_pendingDrDoc.date,
    type:typeEl?typeEl.value:"Splnomocnenie",
    validTo:validEl?validEl.value:"",
    note:noteEl?noteEl.value:""
  });
  _pendingDrDoc = null;
  var tabEl = document.getElementById("ddokumenty");
  if(tabEl) tabEl.innerHTML = buildDriverDocsTab(driverId);
}
function cancelDrDoc(driverId){
  _pendingDrDoc = null;
  var form = document.getElementById("drdoc-form-"+driverId);
  if(form) form.classList.remove("open");
  var fi = document.getElementById("drfile-"+driverId);
  if(fi) fi.value = "";
}
function delDrDoc(driverId,docId){
  removeDriverDoc(driverId,docId);
  var tabEl = document.getElementById("ddokumenty");
  if(tabEl) tabEl.innerHTML = buildDriverDocsTab(driverId);
}

function openDriverDetail(id,activeTab){

  if(!d) return;
  var v = VEHICLES.find(function(x){return x.id===d.vehicleId;});
  var authVehicles = VEHICLES.filter(function(vv){return (VEHICLE_AUTHORIZED[vv.id]||[]).indexOf(d.id)>=0;});

  document.getElementById("dp-sub").textContent = d.role+" | "+d.email;
  document.getElementById("dp-tabs").innerHTML =

    +'<button type="button" class="dp-tab-btn" data-tab="ddokumenty" onclick="dpTab(\'ddokumenty\',this)">Dokumenty ('+getDriverDocs(d.id).length+')</button>'
    +'<button type="button" class="dp-tab-btn" data-tab="dvozidla" onclick="dpTab(\'dvozidla\',this)">Vozidlá</button>';

    +'<div><div style="font-weight:800;font-size:17px;">'+d.name+'</div>'
    +'<div style="font-size:13px;color:#888;margin-top:2px;">'+d.role+'</div>'
    +'<div style="display:flex;gap:6px;margin-top:6px;">'
    +chipHtml(d.authorized?'Oprávnený':'Neoprávnený',d.authorized?'#22c55e':'#ef4444')
    +chipHtml(d.trainingValid?'Školenie OK':'Školenie expir.',d.trainingValid?'#22c55e':'#ef4444')
    +'</div></div></div>'
    +'<div class="dp-grid">'
    +'<div class="dp-cell"><div class="dp-cell-label">Telefón</div><div class="dp-cell-val">'+d.phone+'</div></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">E-mail</div><div class="dp-cell-val" style="font-size:12px;">'+d.email+'</div></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">Prim. vozidlo</div>'
    +'<select class="fleet-select dp-cell-select" onchange="changeDriverVehicle('+d.id+',this.value)">'
    +'<option value="">&mdash; žiadne &mdash;</option>'
    +VEHICLES.map(function(vv){return '<option value="'+vv.id+'"'+(d.vehicleId===vv.id?' selected':'')+'>'+vv.spz+' '+vv.make+' '+vv.model+'</option>';}).join("")
    +'</select></div>'
    +'<div class="dp-cell"><div class="dp-cell-label">Oprávnené vozidlá</div><div class="dp-cell-val">'+((v?1:0)+authVehicles.length)+'</div></div>'
    +'</div>';

  // TERMÍNY
  var termHtml = '<div class="info-section"><div class="info-section-title">Vodičský preukaz a oprávnenie</div>'
    +termChipEdit("Platnosť VP",d.licenseExp,"driver",d.id,"licenseExp",5)
    +termChip("Platnosť oprávnenia",d.licenseExp)
    +'<div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">'
    +chipHtml(d.authorized?'Oprávnený':'Neoprávnený',d.authorized?'#22c55e':'#ef4444')
    +(!d.authorized?'<button type="button" class="btn btn--primary btn--small mb-none" onclick="markAuthorized('+d.id+')"><i class="far fa-check" style="margin-right:6px;"></i>Označiť ako oprávneného</button>':'')
    +'</div>'
    +'</div>'
    +'<div class="info-section"><div class="info-section-title">Školenie na firemné vozidlo</div>'
    +termChipEdit("Absolvované do",d.trainingExp,"driver",d.id,"trainingExp",1)
    +'<div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">'
    +chipHtml(d.trainingValid?'Školenie platné – vyhovuje':'Školenie expirované – nutná obnova',d.trainingValid?'#22c55e':'#ef4444')
    +(!d.trainingValid?'<button type="button" class="btn btn--primary btn--small mb-none" onclick="markTrainingValid('+d.id+')"><i class="far fa-check" style="margin-right:6px;"></i>Označiť ako platné (+1 rok)</button>':'')

    +(lpd<=90||tpd<=90
      ?'<div class="note-box"><div class="note-label">Akcia potrebná</div><div class="note-text">'

  vozHtml += '<div style="display:flex;gap:6px;margin-top:12px;align-items:center;">'

    +'<option value="">Vyberte vozidlo...</option>'

    +'</select>'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="addAuthorizedVehicle('+d.id+')"><i class="far fa-plus" style="margin-right:6px;"></i>Doplniť vozidlo</button>'
    +'</div>';

  document.getElementById("dp-body").innerHTML =
    '<div id="dinfo">'+infoHtml+'</div>'
    +'<div id="dterminy" style="display:none;">'+termHtml+'</div>'

  document.getElementById("overlay").classList.add("open");
  if(activeTab) dpActivate(activeTab);
}

function renderTrips(){
  var totalKm = TRIPS.reduce(function(s,t){return s+(t.dist||0);},0);
  var bizKm = TRIPS.filter(function(t){return t.type==="Služobná";}).reduce(function(s,t){return s+(t.dist||0);},0);

  var rows = TRIPS.length
    ?TRIPS.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(t){
        var v = VEHICLES.find(function(vv){return vv.id===t.vehicleId;});
        return '<tr><td>'+fmtDate(t.date)+'</td><td><strong>'+(v?v.spz:'')+'</strong></td><td>'+t.from+'</td>'
          +'<td>'+t.to+'<div style="font-size:11px;color:#999;">'+t.purpose+'</div></td>'

  document.getElementById("sec-trips").innerHTML =

    +'<div class="kpi-card"><div class="kpi-card__label">Služobné km</div><div class="kpi-card__value" style="font-size:20px;color:#22c55e;">'+bizKm.toLocaleString("sk")+' km</div></div>'

    +'</select></div>'
    +'<div><label class="fleet-label">Dátum</label><input type="date" id="tf-date" class="fleet-input"></div>'
    +'<div><label class="fleet-label">Typ</label><select id="tf-type" class="fleet-select"><option>Služobná</option><option>Súkromná</option></select></div>'
    +'<div><label class="fleet-label">Km od</label><input type="number" id="tf-fkm" class="fleet-input"></div>'

    +'<div><label class="fleet-label">Účel</label><input id="tf-purpose" class="fleet-input" placeholder="Servisná návšteva"></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;">'
    +'<button type="button" class="btn btn--primary btn--small mb-none" onclick="saveTrip()">Uložiť</button>'
    +'<button type="button" class="btn btn--secondary btn--small mb-none" onclick="toggleTripForm()">Zrušiť</button>'
    +'</div></div>'

    +'<div class="fleet-card" style="overflow:hidden;"><table class="fleet-table">'
    +'<thead><tr><th>Dátum</th><th>SPZ</th><th>Odkiaľ</th><th>Kam / Účel</th><th>km</th><th>Typ</th></tr></thead>'

function toggleTripForm(){
  var f = document.getElementById("trip-form");
  if(f) f.classList.toggle("open");
}
function saveTrip(){
  var vid = parseInt(document.getElementById("tf-vid").value,10);
  var date = document.getElementById("tf-date").value;
  var from = document.getElementById("tf-from").value;
  if(!date||!from){ alert("Vyplňte dátum a odkiaľ."); return; }
  var fkm = parseFloat(document.getElementById("tf-fkm").value)||0;
  var tkm = parseFloat(document.getElementById("tf-tkm").value)||0;
  TRIPS.push({
    id:Date.now(), vehicleId:vid, date:date, from:from,
    to:document.getElementById("tf-to").value,
    purpose:document.getElementById("tf-purpose").value,
    driverId:parseInt(document.getElementById("tf-driver").value,10),
    type:document.getElementById("tf-type").value,
    dist:Math.max(0,tkm-fkm)
  });
  toggleTripForm();
  renderTrips();
}
