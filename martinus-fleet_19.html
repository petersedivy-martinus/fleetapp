<!doctype html>
<html lang="sk" class="fonts-loaded">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martinus Fleet</title>
  <link rel="stylesheet" href="https://mrtns.sk/assets/martinus/lb/fonts/Tabac-Sans/style.css?v=0f2ed26c">
  <link rel="stylesheet" href="https://mrtns.sk/assets/martinus/lb/styles/main.css?v=bd16785f">
  <style>
    /* ?? FLEET CUSTOM STYLES on top of Martinus DS ?? */
    body { background: #f6f5f0; }

    /* SIDEBAR */
    #fleet-sidebar {
      position: fixed; top: 0; left: 0; width: 220px; height: 100vh;
      background: #1a1a1a; display: flex; flex-direction: column;
      z-index: 200; overflow-y: auto;
    }
    #fleet-sidebar .sb-logo {
      padding: 20px 18px 16px; border-bottom: 1px solid #333;
    }
    #fleet-sidebar .sb-logo-name {
      font-family: 'Tabac Sans', Georgia, serif; font-weight: 700;
      font-size: 16px; color: #fff; letter-spacing: 0.01em;
    }
    #fleet-sidebar .sb-logo-sub { font-size: 11px; color: #888; margin-top: 3px; }
    #fleet-sidebar nav { padding: 10px 8px; flex: 1; }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 10px 12px; background: transparent;
      border: none; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
      color: #aaa; font-family: 'Tabac Sans', Georgia, serif;
      font-weight: 600; font-size: 13px; text-align: left; transition: all 0.12s;
      gap: 10px;
    }
    .nav-btn i { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
    .nav-btn span { flex: 1; }
    .nav-btn:hover { background: #2a2a2a; color: #fff; }
    .nav-btn.active { background: #2d2d2d; color: #fff; border-left: 3px solid #e63f2a; }
    .nav-badge {
      background: #e63f2a; color: #fff; border-radius: 20px;
      padding: 1px 8px; font-size: 10px; font-weight: 700;
    }
    #fleet-sidebar .sb-foot {
      padding: 14px 18px; border-top: 1px solid #333;
      font-size: 11px; color: #555;
    }

    /* MAIN CONTENT */
    #fleet-main {
      margin-left: 220px; min-height: 100vh; padding: 28px 32px;
    }

    /* SECTION VISIBILITY */
    .fleet-section { display: none; }
    .fleet-section.active { display: block; }

    /* KPI CARDS ROW */
    .kpi-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .kpi-card {
      background: #fff; border: 1px solid #e8e4de; border-radius: 10px;
      padding: 18px 22px; flex: 1; min-width: 130px;
    }
    .kpi-card__label {
      font-size: 10px; color: #999; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px;
    }
    .kpi-card__value {
      font-family: 'Tabac Sans', Georgia, serif;
      font-size: 28px; font-weight: 700; line-height: 1; color: #1a1a1a;
    }

    /* STATUS CHIPS - use badge classes but with custom colors */
    .status-ok { background: #e6f4ea; color: #1a7a3a; border: 1px solid #b2dfbb; border-radius: 5px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-warn { background: #fff3cd; color: #856404; border: 1px solid #ffc107; border-radius: 5px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-danger { background: #fce8e6; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 5px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-neutral { background: #f0ede8; color: #666; border: 1px solid #ddd; border-radius: 5px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-blue { background: #e8f0fe; color: #1a56db; border: 1px solid #c3d3fa; border-radius: 5px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }

    /* GRID CARDS */
    .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

    /* VEHICLE CARD */
    .vcard {
      background: #fff; border: 1.5px solid #e8e4de; border-radius: 12px;
      cursor: pointer; transition: all 0.15s; overflow: hidden;
    }
    .vcard:hover { border-color: #e63f2a; box-shadow: 0 4px 16px rgba(230,63,42,0.1); transform: translateY(-1px); }
    .vcard.alert-card { border-color: #e6a817; }
    .vcard-photo-wrap { height: 140px; overflow: hidden; position: relative; }
    .vcard-body { padding: 14px 16px; }
    .vcard-make { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 15px; color: #1a1a1a; }
    .vcard-sub { font-size: 12px; color: #888; margin-top: 2px; }
    .vcard-chips { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
    .vcard-loc { font-size: 11px; color: #aaa; margin-top: 8px; display: flex; align-items: center; gap: 5px; }
    .vcard-corner { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 30px 30px 0; border-color: transparent #e6a817 transparent transparent; }

    /* DRIVER CARD */
    .dcard { background: #fff; border: 1.5px solid #e8e4de; border-radius: 12px; cursor: pointer; overflow: hidden; transition: all 0.15s; }
    .dcard:hover { border-color: #e63f2a; box-shadow: 0 4px 12px rgba(230,63,42,0.08); }
    .dcard-photo-wrap { height: 90px; overflow: hidden; background: linear-gradient(135deg, #1a1a1a, #333); display: flex; align-items: center; justify-content: center; }
    .dcard-body { padding: 14px 16px; }
    .dcard-name { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .dcard-role { font-size: 12px; color: #888; margin-bottom: 8px; }

    /* DETAIL PANEL */
    #detail-panel {
      position: fixed; top: 0; right: 0; width: 460px; height: 100vh;
      background: #fff; border-left: 1px solid #e8e4de; z-index: 300;
      display: none; flex-direction: column; overflow: hidden;
      box-shadow: -8px 0 32px rgba(0,0,0,0.10);
    }
    #detail-panel.open { display: flex; }
    .dp-head { padding: 20px 22px; border-bottom: 1px solid #e8e4de; flex-shrink: 0; }
    .dp-title { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 20px; color: #1a1a1a; }
    .dp-sub { font-size: 13px; color: #888; margin-top: 3px; }
    .dp-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
    .dp-photo-wrap { height: 160px; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }

    .dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .dp-cell { background: #f6f5f0; border-radius: 8px; padding: 10px 13px; }
    .dp-cell-label { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 3px; }
    .dp-cell-val { font-size: 13px; font-weight: 700; color: #1a1a1a; }

    .info-section { background: #f9f8f5; border-radius: 10px; padding: 13px 15px; margin-bottom: 12px; border: 1px solid #ede9e2; }
    .info-section-title { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; margin-bottom: 8px; }
    .term-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
    .term-label { font-size: 12px; color: #888; min-width: 120px; }

    /* TABS in detail panel */
    .dp-tab-row { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
    .dp-tab-btn {
      background: #f6f5f0; border: 1px solid #e8e4de; border-radius: 7px;
      padding: 6px 13px; font-size: 12px; cursor: pointer;
      font-family: 'Tabac Sans', Georgia, serif; font-weight: 600; color: #888;
      transition: all 0.12s;
    }
    .dp-tab-btn:hover { background: #ede9e2; color: #1a1a1a; }
    .dp-tab-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* SEC TABS (filter buttons) */
    .sec-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .sec-tab {
      background: #fff; border: 1.5px solid #e8e4de; border-radius: 8px;
      padding: 7px 16px; font-size: 12px; cursor: pointer;
      font-family: 'Tabac Sans', Georgia, serif; font-weight: 600; color: #888;
      transition: all 0.12s;
    }
    .sec-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* TABLE */
    .fleet-table { width: 100%; border-collapse: collapse; }
    .fleet-table th { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; padding: 10px 14px; background: #f9f8f5; text-align: left; border-bottom: 1px solid #e8e4de; }
    .fleet-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f2ede8; vertical-align: middle; }
    .fleet-table tr:hover td { background: #faf9f7; }
    .fleet-table tr:last-child td { border-bottom: none; }

    /* SEARCH INPUT */
    .fleet-search {
      border: 1.5px solid #e8e4de; border-radius: 8px; padding: 9px 14px;
      font-size: 13px; font-family: 'Tabac Sans', Georgia, serif;
      color: #1a1a1a; background: #fff; outline: none; width: 100%;
      transition: border-color 0.15s;
    }
    .fleet-search:focus { border-color: #e63f2a; }

    /* SECTION HEADER */
    .fleet-sh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .fleet-sh h2 { font-family: 'Tabac Sans', Georgia, serif; font-weight: 700; font-size: 22px; color: #1a1a1a; }

    /* PROGRESS BAR */
    .prog-wrap { height: 6px; background: #ede9e2; border-radius: 3px; overflow: hidden; }
    .prog-bar { height: 100%; border-radius: 3px; }

    /* ALERT ROW */
    .alert-row { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f2ede8; align-items: center; }
    .alert-row:last-child { border-bottom: none; }
    .alert-row:hover { background: #faf9f7; cursor: pointer; }

    /* OVERLAY */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 250; display: none; }
    #overlay.open { display: block; }

    /* CARD VARIANTS */
    .fleet-card { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; }
    .fleet-card-padded { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; padding: 18px 20px; }

    /* VIGN FLAGS */
    .vign-flags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .vign-flag { background: #e8f0fe; color: #1a56db; border: 1px solid #c3d3fa; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

    /* AUTHORIZED PILLS */
    .authorized-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .auth-pill { background: #fce8e6; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; }

    /* NOTE BOX */
    .note-box { background: #fff8e6; border: 1px solid #f0c040; border-radius: 8px; padding: 11px 13px; margin-bottom: 10px; }
    .note-label { font-size: 10px; color: #856404; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .note-text { font-size: 13px; color: #5c4a00; }

    /* FORM ELEMENTS */
    .fleet-input { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 8px 11px; font-size: 13px; font-family: 'Tabac Sans', Georgia, serif; color: #1a1a1a; background: #fff; outline: none; width: 100%; transition: border-color 0.15s; }
    .fleet-input:focus { border-color: #e63f2a; }
    .fleet-select { border: 1.5px solid #e8e4de; border-radius: 8px; padding: 8px 11px; font-size: 13px; font-family: 'Tabac Sans', Georgia, serif; color: #1a1a1a; background: #fff; outline: none; width: 100%; }
    .fleet-label { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.6px; display: block; margin-bottom: 4px; text-transform: uppercase; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .fleet-form-card { background: #fff; border: 2px solid #e63f2a; border-radius: 12px; padding: 18px; margin-bottom: 16px; display: none; }
    .fleet-form-card.open { display: block; }

    /* MAINTENANCE CARD */
    .mcard { background: #fff; border: 1px solid #e8e4de; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }

    /* INVOICE / DOC ROWS */
    .drop-zone { border: 2px dashed #e8e4de; border-radius: 10px; padding: 22px; text-align: center; cursor: pointer; transition: all 0.15s; background: #faf9f7; margin-bottom: 12px; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #e63f2a; background: #fce8e6; }
    .drop-zone-icon { font-size: 28px; margin-bottom: 7px; }
    .drop-zone-text { font-size: 13px; color: #888; font-weight: 500; }
    .drop-zone-sub { font-size: 11px; color: #bbb; margin-top: 3px; }
    .invoice-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: #f9f8f5; border-radius: 8px; margin-bottom: 6px; border: 1px solid #e8e4de; }
    .invoice-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .invoice-icon.pdf { background: #fce8e6; color: #c0392b; }
    .invoice-icon.img { background: #e8f0fe; color: #1a56db; }
    .invoice-icon.other { background: #e8f5ea; color: #1a7a3a; }
    .invoice-meta { flex: 1; min-width: 0; }
    .invoice-name { font-size: 13px; font-weight: 600; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .invoice-detail { font-size: 11px; color: #aaa; margin-top: 1px; }
    .invoice-type { font-size: 10px; color: #888; background: #ede9e2; border-radius: 4px; padding: 2px 7px; font-weight: 600; white-space: nowrap; }
    .invoice-del { background: none; border: none; cursor: pointer; color: #e63f2a; font-size: 16px; padding: 4px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
    .invoice-del:hover { opacity: 1; background: #fce8e6; }
    .inv-form { background: #fff; border: 1px solid #e8e4de; border-radius: 8px; padding: 13px; margin-bottom: 10px; display: none; }
    .inv-form.open { display: block; }

    /* CHATBOT */
    #chat-fab { position: fixed; bottom: 24px; right: 24px; z-index: 500; border: none; cursor: pointer; border-radius: 50%; width: 56px; height: 56px; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: all 0.2s; background: #1a1a1a; color: #fff; font-family: 'Tabac Sans', Georgia, serif; }
    #chat-fab:hover { transform: scale(1.08); }
    #chat-window { position: fixed; bottom: 92px; right: 24px; width: 380px; height: 560px; z-index: 500; display: none; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,0.18); font-family: 'Tabac Sans', Georgia, serif; }
    #chat-window.open { display: flex; }
    #chat-head { padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #chat-persona-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    #chat-persona-name { font-weight: 700; font-size: 14px; flex: 1; }
    #chat-persona-sub { font-size: 11px; opacity: 0.7; margin-top: 1px; }
    #chat-switcher { padding: 8px 12px; display: flex; gap: 6px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .persona-btn { flex: 1; border: none; border-radius: 8px; padding: 6px 4px; font-size: 10px; font-weight: 700; cursor: pointer; font-family: 'Tabac Sans', Georgia, serif; opacity: 0.55; transition: all 0.15s; text-align: center; }
    .persona-btn.active { opacity: 1; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .msg-bot { align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-user { align-self: flex-end; background: #1a1a1a; color: #fff; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; opacity: 0.55; margin-top: 4px; }
    .msg-notif { border-left: 3px solid; padding-left: 10px; font-style: italic; font-size: 12px; }
    .msg-loading { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-6px);} }
    #chat-input-row { padding: 10px 12px; display: flex; gap: 8px; flex-shrink: 0; }
    #chat-input { flex: 1; border: none; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-family: 'Tabac Sans', Georgia, serif; outline: none; }
    #chat-send { border: none; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #chat-quick { padding: 0 12px 10px; display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
    .qbtn { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: 'Tabac Sans', Georgia, serif; font-weight: 600; white-space: nowrap; }
    .qbtn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<aside id="fleet-sidebar">
  <div class="sb-logo">
    <div class="sb-logo-name">Martinus Fleet</div>
    <div class="sb-logo-sub">Spr\u00E1va vozov\u00E9ho parku</div>
  </div>
  <nav id="nav"></nav>
  <div class="sb-foot">Martinus s.r.o. &copy; 2025</div>
</aside>
<div id="main" style="margin-left:220px;min-height:100vh;padding:28px 32px;background:#f6f5f0;">
  <div id="sec-dashboard" class="fleet-section active"></div>
  <div id="sec-vehicles" class="fleet-section"></div>
  <div id="sec-drivers" class="fleet-section"></div>
  <div id="sec-trips" class="fleet-section"></div>
  <div id="sec-maintenance" class="fleet-section"></div>
  <div id="sec-alerts" class="fleet-section"></div>
</div>
<div id="overlay" onclick="closeDetail()"></div>
<div id="detail-panel">
  <div class="dp-head">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <div class="dp-title" id="dp-title"></div>
        <div class="dp-sub" id="dp-sub"></div>
      </div>
      <button type="button" class="btn btn--secondary btn--small mb-none" onclick="closeDetail()">Zatvori\u0165</button>
    </div>
    <div class="dp-tab-row" id="dp-tabs"></div>
  </div>
  <div class="dp-body" id="dp-body"></div>
</div>
<div class="kpi-modal" id="kpi-modal" onclick="if(event.target===this)closeKpiModal()">
  <div class="kpi-modal-box">
    <div class="kpi-modal-head">
      <div class="kpi-modal-title" id="kpi-modal-title"></div>
      <button type="button" class="btn btn--secondary btn--small mb-none" onclick="closeKpiModal()">Zatvori\u0165</button>
    </div>
    <div class="kpi-modal-body">
      <table class="fleet-table" style="width:100%;">
        <thead><tr><th>Vozidlo</th><th>Km</th><th>STK</th><th>Do servisu</th><th>Lokalita</th><th>Vodi\u010D</th></tr></thead>
        <tbody id="kpi-modal-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// === PHOTO URLS (Unsplash - real car photos by make) ===
var MAKE_COLORS = {
  "Skoda":{"bg1":"#1a3a6b","bg2":"#2563eb","accent":"#60a5fa","logo":"S"},
  "Volkswagen":{"bg1":"#1b1b2f","bg2":"#2563eb","accent":"#93c5fd","logo":"VW"},
  "Ford":{"bg1":"#1c1f2e","bg2":"#1d4ed8","accent":"#3b82f6","logo":"F"},
  "Renault":{"bg1":"#1f1c2c","bg2":"#dc2626","accent":"#fca5a5","logo":"R"},
};
var MODEL_SHAPES = {
  "Octavia":"sedan","Octavia Combi":"combi","Superb":"sedan","Fabia":"hatch",
  "Fabia Combi":"combi","Kodiaq":"suv","Polo":"hatch","Transporter":"van",
  "Caddy":"van","Crafter":"truck","Transit Custom":"van","Transit":"truck",
  "Puma":"suv","Trafic":"van","Kangoo":"van","Master":"truck",
};
function getCarSVG(v,w,h){
  var mc=MAKE_COLORS[v.make]||{bg1:"#1e293b",bg2:"#334155",accent:"#94a3b8",logo:"?"};
  var shape=MODEL_SHAPES[v.model]||"sedan";
  var W=w||400,H=h||160;
  var carW=Math.round(W*0.62),carH,bodyY,roofH,roofW,roofX;
  if(shape==="sedan"||shape==="hatch"){carH=Math.round(H*0.42);bodyY=Math.round(H*0.52);roofH=Math.round(H*0.28);roofW=Math.round(carW*0.52);roofX=Math.round((W-carW)/2+carW*0.22);}

// === HELPERS ===
function daysTo(d){return Math.ceil((new Date(d)-new Date())/86400000);}
function urgCol(d){return d<0?"#ef4444":d<=30?"#f97316":d<=90?"#eab308":"#22c55e";}
function fmtDate(d){return d?new Date(d).toLocaleDateString("sk-SK"):"-";}
function kmLeft(v){return Math.max(0,v.nextServiceKm-v.km);}
function fmtEur(n){return(+(n||0)).toFixed(2)+" EUR";}
function chipHtml(label,col){return '<span class="chip" style="background:'+col+'18;color:'+col+';border-color:'+col+'30">'+label+'</span>';}
function statusCol(s){return s==="aktivne"?"#22c55e":s==="servis"?"#f97316":"#94a3b8";}
function statusLabel(s){return s==="aktivne"?"Akt\u00EDvne":s==="servis"?"V servise":"Neakt\u00EDvne";}

function termChip(label,date){var d=daysTo(date),col=urgCol(d);return '<div class="term-row"><span class="term-label">'+label+'</span>'+chipHtml(fmtDate(date)+" | "+(d<0?"EXP!":d+"d"),col)+'</div>';}

function getInvoices(vehicleId){return INVOICES[vehicleId]||[];}

function addInvoice(vehicleId,inv){
  if(!INVOICES[vehicleId]) INVOICES[vehicleId]=[];
  INVOICES[vehicleId].push(inv);
}

function removeInvoice(vehicleId,invId){
  if(!INVOICES[vehicleId]) return;
  INVOICES[vehicleId]=INVOICES[vehicleId].filter(function(i){return i.id!==invId;});
}

function invIconClass(ext){return ext==="pdf"?"pdf":["jpg","jpeg","png","gif"].indexOf(ext)>=0?"img":"other";}
function invIconChar(ext){return ext==="pdf"?"PDF":["jpg","jpeg","png","gif"].indexOf(ext)>=0?"IMG":"DOC";}

function fmtFileSize(bytes){
  if(!bytes) return "";
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return Math.round(bytes/1024)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

// Pending file for inv form
var _pendingInvFile = null;

function handleInvDrop(event,vehicleId){
  event.preventDefault();
  document.getElementById("drop-"+vehicleId).classList.remove("drag-over");
  var files=event.dataTransfer.files;
  if(files&&files.length>0) processInvFile(files[0],vehicleId);
}

function handleInvFiles(event,vehicleId){
  var files=event.target.files;
  if(files&&files.length>0) processInvFile(files[0],vehicleId);
}

function processInvFile(file,vehicleId){
  _pendingInvFile={name:file.name,size:fmtFileSize(file.size),ext:file.name.split(".").pop().toLowerCase(),date:new Date().toISOString().slice(0,10),vehicleId:vehicleId};
  var form=document.getElementById("inv-form-"+vehicleId);
  if(form){form.classList.add("open");}
  // Pre-fill desc with filename (without extension)
  var descEl=document.getElementById("inv-desc-"+vehicleId);
  if(descEl) descEl.value=file.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
}

function confirmInvAdd(vehicleId){
  if(!_pendingInvFile) return;
  INV_COUNTER++;
  var typeEl=document.getElementById("inv-type-"+vehicleId);
  var amountEl=document.getElementById("inv-amount-"+vehicleId);
  var descEl=document.getElementById("inv-desc-"+vehicleId);
  var inv={
    id:INV_COUNTER,vehicleId:vehicleId,
    name:_pendingInvFile.name,size:_pendingInvFile.size,
    ext:_pendingInvFile.ext,date:_pendingInvFile.date,
    type:typeEl?typeEl.value:"Servisn\u00E1 fakt\u00FAra",
    amount:amountEl?parseFloat(amountEl.value)||0:0,
    eventDesc:descEl?descEl.value:""
  };
  addInvoice(vehicleId,inv);
  _pendingInvFile=null;
  // Re-render the invoice tab
  var tabEl=document.getElementById("vfaktury");
  if(tabEl) tabEl.innerHTML=buildInvoiceTab(vehicleId);
}

function cancelInvAdd(vehicleId){
  _pendingInvFile=null;
  var form=document.getElementById("inv-form-"+vehicleId);
  if(form) form.classList.remove("open");
  var fileInput=document.getElementById("inv-file-"+vehicleId);
  if(fileInput) fileInput.value="";
}

function delInv(vehicleId,invId){
  removeInvoice(vehicleId,invId);
  var tabEl=document.getElementById("vfaktury");
  if(tabEl) tabEl.innerHTML=buildInvoiceTab(vehicleId);
}

function openKpiModal(idx) {
  var configs = [
    {filter:"all",     title:"V\u0161etky vozidla"},
    {filter:"aktivne", title:"Akt\u00EDvne vozidla"},
    {filter:"servis",  title:"Vozidl\u00E1 v servise"},
    {filter:"urgent",  title:"Vy\u017Eaduj\u00FA pozornos\u0165"},
  ];
  var cfg = configs[idx] || configs[0];
  var filter = cfg.filter, title = cfg.title;
  var vs = VEHICLES.filter(function(v){
    if(filter==="all") return true;
    if(filter==="aktivne") return v.status==="aktivne";
    if(filter==="servis") return v.status==="servis";
    if(filter==="urgent") return daysTo(v.stk)<=30||daysTo(v.insurance)<=30||kmLeft(v)<=5000;
    return true;
  });
  document.getElementById("kpi-modal-title").textContent=title+" ("+vs.length+")";
  var rows=vs.map(function(v){
    var dr=DRIVERS.find(function(d){return d.id===v.driverId;});
    var sd=daysTo(v.stk),kl=kmLeft(v);
    return "<tr onclick=\"closeKpiModal();openVehicleDetail("+v.id+")\" style=\"cursor:pointer;\">"
      +"<td><span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:"+statusCol(v.status)+";margin-right:6px;vertical-align:middle;\"></span>"
      +"<strong>"+v.spz+"</strong> "+v.make+" "+v.model+"</td>"
      +"<td>"+v.km.toLocaleString("sk")+" km</td>"
      +"<td>"+chipHtml("STK:"+(sd<0?"expir.":sd+"d"),urgCol(sd))+"</td>"
      +"<td>"+chipHtml(kl<=0?"SERVIS!":"+"+kl.toLocaleString("sk")+"km",kl<=0?"#ef4444":kl<=5000?"#f97316":"#22c55e")+"</td>"
      +"<td style=\"font-size:12px;color:#888;\">"+v.location+"</td>"
      +"<td style=\"font-size:12px;color:#888;\">"+(dr?dr.name:"-")+"</td>"
      +"</tr>";
  }).join("");
  document.getElementById("kpi-modal-rows").innerHTML=rows||"<tr><td colspan=\"6\" style=\"color:#aaa;text-align:center;padding:20px;\">\u017Diadne vozidl\u00E1</td></tr>";
  document.getElementById("kpi-modal").classList.add("open");
}
function closeKpiModal(){
  document.getElementById("kpi-modal").classList.remove("open");
}

    +'<div class="drop-zone-text">Pretiahni dokument alebo klikni na nahratie</div>'
    +'<div class="drop-zone-sub">Splnomocnenia, z\u00E1pisnice, certifik\u00E1ty &bull; PDF, JPG, PNG, DOCX</div>'

    +'</div>';

  var formHtml='<div class="inv-form" id="drdoc-form-'+driverId+'">'
    +'<div style="font-size:12px;font-weight:700;color:#0d1117;margin-bottom:10px;">Upresnite dokument</div>'

    +DRDOC_TYPES.map(function(t){return '<option>'+t+'</option>';}).join("")
    +'</select></div>'
    +'<div><label style="font-size:10px;color:#9aa3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:3px;">Platn\u00E9 do</label>'
    +'<input type="date" id="drvalid-'+driverId+'" style="border:1px solid #e4e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:\'DM Sans\',sans-serif;width:100%;outline:none;"></div>'
    +'</div>'
    +'<div style="margin-bottom:8px;"><label style="font-size:10px;color:#9aa3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:3px;">Pozn\u00E1mka (volitelna)</label>'
    +'<input type="text" id="drnote-'+driverId+'" placeholder="napr. Skolenie BOZP + firemne vozidla" style="border:1px solid #e4e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:\'DM Sans\',sans-serif;width:100%;outline:none;"></div>'
    +'<div style="display:flex;gap:6px;">'
    +'<button class="btn btn-primary btn-sm" onclick="confirmDrDoc('+driverId+')">Ulo\u017Ei\u0165</button>'
    +'<button class="btn btn-secondary btn-sm" onclick="cancelDrDoc('+driverId+')">Zru\u0161i\u0165</button>'
    +'</div></div>';

  var listHtml = docs.length === 0
    ? '<div style="font-size:13px;color:#9aa3b8;text-align:center;padding:20px 0;">\u017Diadne dokumenty. Nahrajte splnomocnenie alebo z\u00E1pisnicu.</div>'
    : docs.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(doc){
        var col = typeColors[doc.type]||"#64748b";
        var ic = invIconClass(doc.ext);
        var expDays = doc.validTo ? daysTo(doc.validTo) : null;
        var expChip = expDays !== null
          ? '<span style="font-size:10px;font-weight:700;color:'+urgCol(expDays)+';background:'+urgCol(expDays)+'14;border:1px solid '+urgCol(expDays)+'30;border-radius:4px;padding:2px 7px;white-space:nowrap;">'+(expDays<0?"EXP!":expDays+"d")+'</span>'
          : '';

          +'<div class="invoice-icon '+ic+'">'+invIconChar(doc.ext)+'</div>'
          +'<div class="invoice-meta">'
          +'<div class="invoice-name">'+doc.name+'</div>'
          +'<div class="invoice-detail">'+fmtDate(doc.date)+(doc.size?' &bull; '+doc.size:'')+(doc.validTo?' &bull; platn\u00E9 do '+fmtDate(doc.validTo):'')+(doc.note?' &bull; '+doc.note:'')+'</div>'
          +'</div>'

          +'<button class="invoice-del" onclick="delDrDoc('+driverId+','+doc.id+')" title="Odstranit">&#215;</button>'
          +'</div>';
      }).join("");

  return statsHtml + dropHtml + formHtml + listHtml;
}

function handleDrDocDrop(event,driverId){
  event.preventDefault();
  document.getElementById("drdrop-"+driverId).classList.remove("drag-over");
  var files=event.dataTransfer.files;
  if(files&&files.length>0) processDrDocFile(files[0],driverId);
}

function handleDrDocFiles(event,driverId){
  var files=event.target.files;
  if(files&&files.length>0) processDrDocFile(files[0],driverId);
}

function processDrDocFile(file,driverId){
  _pendingDrDoc={name:file.name,size:fmtFileSize(file.size),ext:file.name.split(".").pop().toLowerCase(),date:new Date().toISOString().slice(0,10),driverId:driverId};
  var form=document.getElementById("drdoc-form-"+driverId);
  if(form) form.classList.add("open");
  var noteEl=document.getElementById("drnote-"+driverId);
  if(noteEl) noteEl.value=file.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
  // Auto-detect type from filename
  var typeEl=document.getElementById("drtype-"+driverId);
  if(typeEl){
    var fn=file.name.toLowerCase();
    if(fn.indexOf("splnomocnen")>=0) typeEl.value="Splnomocnenie";
    else if(fn.indexOf("zapisnic")>=0||fn.indexOf("skolenie")>=0||fn.indexOf("skoleni")>=0) typeEl.value="Z\u00E1pisnica zo \u0161kolenia";
    else if(fn.indexOf("certifik")>=0) typeEl.value="Certifik\u00E1t \u0161kolenia";
    else if(fn.indexOf("lekarsk")>=0||fn.indexOf("posudok")>=0) typeEl.value="Lek\u00E1rsky posudok";
    else if(fn.indexOf("opravnen")>=0||fn.indexOf("potvrdeni")>=0) typeEl.value="Potvrdenie opr\u00E1vnenia";
  }
}

function confirmDrDoc(driverId){
  if(!_pendingDrDoc) return;
  DRDOC_COUNTER++;
  var typeEl=document.getElementById("drtype-"+driverId);
  var validEl=document.getElementById("drvalid-"+driverId);
  var noteEl=document.getElementById("drnote-"+driverId);
  var doc={
    id:DRDOC_COUNTER, driverId:driverId,
    name:_pendingDrDoc.name, size:_pendingDrDoc.size,
    ext:_pendingDrDoc.ext, date:_pendingDrDoc.date,
    type:typeEl?typeEl.value:"Splnomocnenie",
    validTo:validEl?validEl.value:"",
    note:noteEl?noteEl.value:""
  };
  addDriverDoc(driverId,doc);
  _pendingDrDoc=null;
  var tabEl=document.getElementById("ddokumenty");
  if(tabEl) tabEl.innerHTML=buildDriverDocsTab(driverId);
}

function cancelDrDoc(driverId){
  _pendingDrDoc=null;
  var form=document.getElementById("drdoc-form-"+driverId);
  if(form) form.classList.remove("open");
  var fi=document.getElementById("drfile-"+driverId);
  if(fi) fi.value="";
}

function delDrDoc(driverId,docId){
  removeDriverDoc(driverId,docId);
  var tabEl=document.getElementById("ddokumenty");
  if(tabEl) tabEl.innerHTML=buildDriverDocsTab(driverId);
}

function dpTab(tabId,btn){

    return ms&&mq;

    var sd=daysTo(v.stk),kl=kmLeft(v);

  var rows=TRIPS.length?TRIPS.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(t,i){var v=VEHICLES.find(function(vv){return vv.id===t.vehicleId;});return '<tr><td>'+fmtDate(t.date)+'</td><td><strong>'+(v?v.spz:"")+'</strong></td><td>'+t.from+'</td><td>'+t.to+' <div style="font-size:11px;color:#9aa3b8;">'+t.purpose+'</div></td><td><strong>'+t.dist+'</strong></td><td>'+chipHtml(t.type,t.type==="Slu\u017Eobn\u00E1"?"#22c55e":"#94a3b8")+'</td></tr>';}).join(""):'<tr><td colspan="6" style="color:#9aa3b8;text-align:center;padding:20px;">\u017Diadne z\u00E1znamy jazd</td></tr>';
  document.getElementById("sec-trips").innerHTML='<div class="sh"><h2>Kniha j\u00E1zd</h2><button class="btn btn-primary btn-sm" onclick="toggleTripForm()">+ Nov\u00E1 jazda</button></div><div class="kpi-row"><div class="kpi"><div class="kpi-label">Celkov\u00FD n\u00E1jazd</div><div class="kpi-value" style="font-size:20px;">'+totalKm.toLocaleString("sk")+' km</div></div><div class="kpi"><div class="kpi-label">Slu\u017Eobn\u00E9 km</div><div class="kpi-value" style="font-size:20px;color:#22c55e;">'+bizKm.toLocaleString("sk")+' km</div></div><div class="kpi"><div class="kpi-label">Po\u010Det j\u00E1zd</div><div class="kpi-value">'+TRIPS.length+'</div></div></div>'
    +'<div class="form-card" id="trip-form"><div class="form-grid"><div class="form-field"><label>Vozidlo</label><select id="tf-vid">'+VEHICLES.filter(function(v){return v.status==="aktivne";}).map(function(v){return '<option value="'+v.id+'">'+v.spz+' - '+v.make+'</option>';}).join("")+'</select></div><div class="form-field"><label>D\u00E1tum</label><input type="date" id="tf-date"></div><div class="form-field"><label>Typ</label><select id="tf-type"><option>Slu\u017Eobn\u00E1</option><option>S\u00FAkromn\u00E1</option></select></div><div class="form-field"><label>Km od</label><input type="number" id="tf-fkm"></div><div class="form-field"><label>Km do</label><input type="number" id="tf-tkm"></div><div class="form-field"><label>Vodi\u010D</label><select id="tf-driver">'+DRIVERS.map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join("")+'</select></div><div class="form-field"><label>Odkia\u013E</label><input id="tf-from" placeholder="Martin HQ"></div><div class="form-field"><label>Kam</label><input id="tf-to" placeholder="OC Cubicon BA"></div><div class="form-field"><label>Ucel</label><input id="tf-purpose" placeholder="Servisna navsteva"></div></div><div style="display:flex;gap:8px;"><button class="btn btn-primary btn-sm" onclick="saveTrip()">Ulo\u017Ei\u0165</button><button class="btn btn-secondary btn-sm" onclick="toggleTripForm()">Zru\u0161i\u0165</button></div></div>'
    +'<div class="card" style="overflow:hidden;"><table class="tbl"><thead><tr><th>D\u00E1tum</th><th>SPZ</th><th>Odkia\u013E</th><th>Kam / Ucel</th><th>km</th><th>Typ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function toggleTripForm(){var f=document.getElementById("trip-form");if(f)f.classList.toggle("open");}
function saveTrip(){
  var vid=parseInt(document.getElementById("tf-vid").value);
  var date=document.getElementById("tf-date").value;
  var from=document.getElementById("tf-from").value;
  if(!date||!from){alert("Vypl\u0148te d\u00E1tum a odkia\u013E.");return;}
  var fkm=parseFloat(document.getElementById("tf-fkm").value)||0;
  var tkm=parseFloat(document.getElementById("tf-tkm").value)||0;
  TRIPS.push({id:Date.now(),vehicleId:vid,date:date,from:from,to:document.getElementById("tf-to").value,purpose:document.getElementById("tf-purpose").value,driver:document.getElementById("tf-driver").value,type:document.getElementById("tf-type").value,dist:Math.max(0,tkm-fkm)});
  toggleTripForm();renderTrips();
}

function renderMaintenance(){
  var cards=MAINT.map(function(m){
    var v=VEHICLES.find(function(vv){return vv.id===m.vehicleId;});if(!v)return "";
    var rem=m.nextKm-v.km,pct=Math.max(0,Math.min(100,(v.km-m.lastKm)/(m.intervalKm)*100));
    var col=rem<=0?"#ef4444":rem<=2000?"#f97316":rem<=5000?"#eab308":"#22c55e";
    return '<div class="mcard"><div style="display:flex;justify-content:space-between;margin-bottom:10px;align-items:flex-start;"><div><div style="font-weight:700;font-size:14px;">'+v.spz+' - '+v.make+' '+v.model+'</div><div style="font-size:12px;color:#9aa3b8;margin-top:2px;">'+m.type+' | ka\u017Ed\u00FD '+m.intervalKm.toLocaleString("sk")+' km</div></div>'+chipHtml(rem<=0?"IHNE\u010E!":rem<=2000?"SKORO!":"+"+rem.toLocaleString("sk")+" km",col)+'</div><div class="prog-wrap" style="margin-bottom:8px;"><div class="prog-bar" style="width:'+pct+'%;background:'+col+';"></div></div><div style="display:flex;gap:20px;flex-wrap:wrap;"><span style="font-size:12px;color:#9aa3b8;">Posledn\u00FD: '+m.lastKm.toLocaleString("sk")+' km ('+fmtDate(m.lastDate)+')</span><span style="font-size:12px;color:#9aa3b8;">Nasleduj\u00FAci: '+m.nextKm.toLocaleString("sk")+' km</span><span style="font-size:12px;font-weight:700;color:'+col+';">Zostatok: '+rem.toLocaleString("sk")+' km</span></div></div>';
  }).join("");
  document.getElementById("sec-maintenance").innerHTML='<div class="sh"><h2>Prevent\u00EDvna \u00FAdr\u017Eba</h2></div>'+cards;
}

// === ALERTS ===
function renderAlerts(){
  var alerts=[];
  VEHICLES.forEach(function(v){
    var sd=daysTo(v.stk),id2=daysTo(v.insurance),kl=kmLeft(v);
    if(sd<=60)alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"STK",days:sd,vid:v.id,cat:"Vozidlo"});
    if(id2<=60)alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"Poistenie",days:id2,vid:v.id,cat:"Vozidlo"});
    if(kl<=5000&&v.status==="aktivne")alerts.push({who:v.make+" "+v.model,spz:v.spz,label:"Servis - "+kl.toLocaleString("sk")+" km",days:999,vid:v.id,cat:"Servis"});
    v.vignettes.forEach(function(c){var vd=daysTo(VIGN_EXPIRY[c]);if(vd<=60)alerts.push({who:v.spz+" - znamka "+c,spz:v.spz,label:"Dia\u013Eni\u010Dn\u00E1 zn\u00E1mka "+c,days:vd,vid:v.id,cat:"Znamka"});});
  });
  DRIVERS.forEach(function(d){
    var lpd=daysTo(d.licenseExp),tpd=daysTo(d.trainingExp);
    if(lpd<=90)alerts.push({who:d.name,spz:"VP",label:"Platnos\u0165 VP",days:lpd,vid:null,cat:"Vodi\u010D"});
    if(tpd<=60)alerts.push({who:d.name,spz:"Skolenie",label:"Expir\u00E1cia \u0161kolenia",days:tpd,vid:null,cat:"Vodi\u010D"});
    if(!d.authorized)alerts.push({who:d.name,spz:"Opravnenie",label:"Neopr\u00E1vnen\u00FD vodic",days:-1,vid:null,cat:"Vodi\u010D"});
  });
  alerts.sort(function(a,b){return a.days-b.days;});
  var catCols={"Vozidlo":"#2563eb","Servis":"#f97316","Znamka":"#8b5cf6","Vodi\u010D":"#ec4899"};
  var rows=alerts.map(function(a,i){
    var dc=urgCol(a.days===999?20:a.days);
    var click=a.vid?"onclick=\"openVehicleDetail("+a.vid+")\" style=\"cursor:pointer;\"":'';
    return '<div class="alert-row" '+click+'>'
      +chipHtml(a.days===999?"Km!":a.days<0?"EXP!":a.days+"d",dc)
      +'<div style="flex:1;"><span style="font-size:14px;font-weight:700;">'+a.who+'</span> <span style="font-size:13px;color:#9aa3b8;">| '+a.label+'</span></div>'
      +chipHtml(a.cat,catCols[a.cat]||"#64748b")
      +'<span style="font-size:12px;color:#9aa3b8;margin-left:6px;">'+a.spz+'</span>'
      +'</div>';
  }).join("");
  var content=alerts.length
    ?'<div class="card" style="overflow:hidden;">'+rows+'</div>'
    :'<div class="card" style="padding:20px;background:#f0fdf4;border:1px solid #bbf7d0;"><div style="font-size:14px;color:#22c55e;font-weight:700;">\u017Diadne urgentn\u00E9 upozornenia</div></div>';
  document.getElementById("sec-alerts").innerHTML='<div class="sh"><h2>Upozornenia ('+alerts.length+')</h2></div>'+content;
}

<script>async function callAI(userMessage) {
  // Try Anthropic API first (works in Claude.ai artifacts)
  try {
    var messages = chatHistory.map(function(m){return {role:m.role,content:m.content};});
    messages.push({role:"user",content:userMessage});
    var response = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:800,
        system:buildSystemPrompt(currentPersona),
        messages:messages
      })
    });
    if(response.ok){
      var data = await response.json();
      if(data.content && data.content[0]) return data.content[0].text;
    }
  } catch(e) {}
  // Fallback: local rule-based response
  return localResponse(userMessage);
}

function localResponse(q) {
  var p = currentPersona;
  var ql = q.toLowerCase();

  // Gather fleet context
  var urgent = VEHICLES.filter(function(v){return daysTo(v.stk)<=30||daysTo(v.insurance)<=30||kmLeft(v)<=5000;});
  var inSvc = VEHICLES.filter(function(v){return v.status==="servis";});
  var active = VEHICLES.filter(function(v){return v.status==="aktivne";});
  var expVP = DRIVERS.filter(function(d){return daysTo(d.licenseExp)<=90;});
  var noTrain = DRIVERS.filter(function(d){return !d.trainingValid;});

  // Find specific vehicle
  var foundV = null;
  VEHICLES.forEach(function(v){
    if(ql.indexOf(v.spz.toLowerCase())>=0 || ql.indexOf(v.model.toLowerCase())>=0 || ql.indexOf(v.make.toLowerCase())>=0) foundV=v;
  });

  // Find specific driver
  var foundD = null;
  DRIVERS.forEach(function(d){
    var parts = d.name.toLowerCase().split(" ");
    if(parts.some(function(part){return ql.indexOf(part)>=0&&part.length>3;})) foundD=d;
  });

  var r = "";

  // Persona prefix/suffix helpers
  function pfx(text){ return p==="hoke"?"Dovol\u00EDm si informova\u0165: "+text:p==="han"?text+" Ktor\u00E9 lode potrebuj\u00FA pozornos\u0165, kapit\u00E1n?":"Hl\u00E1sim: "+text; }
  function wrap(text){ return p==="charon"?"Zaznamenan\u00E9 v evidencii. "+text+". Bez \u010Fal\u0161\u00EDch obolov nepokra\u010Dujeme.":p==="han"?"Po\u010Duj, "+text+". M\u00E1m zl\u00FD pocit z toho, ke\u010F sa o flotile nevie v\u0161etko.":text+". Budem na to dohliada\u0165, nebojte sa."; }

  // Specific vehicle query
  if(foundV){
    var v=foundV;
    var dr=DRIVERS.find(function(d){return d.id===v.driverId;});
    var sd=daysTo(v.stk), kl=kmLeft(v);
    r = v.spz+" - "+v.make+" "+v.model+" ("+v.year+")"
      +"\nStav: "+v.status+", Km: "+v.km.toLocaleString("sk")+", Lokalita: "+v.location
      +"\nSTK: "+fmtDate(v.stk)+" ("+(sd<0?"EXPIROVALA!":sd+" dni")+")"
      +"\nPoistenie: "+fmtDate(v.insurance)
      +"\nDo servisu: +"+kl.toLocaleString("sk")+" km"
      +"\nPrim\u00E1rny vodic: "+(dr?dr.name:"nepriradeny")
      +(v.note?"\nPozn\u00E1mka: "+v.note:"");
    return wrap(r);
  }

  // Specific driver query
  if(foundD){
    var d=foundD;
    var vd=VEHICLES.find(function(v){return v.id===d.vehicleId;});
    var ld=daysTo(d.licenseExp), td=daysTo(d.trainingExp);
    r = d.name+" ("+d.role+")"
      +"\nVozidlo: "+(vd?vd.spz+" "+vd.make+" "+vd.model:"nepriradene")
      +"\nVP plati do: "+fmtDate(d.licenseExp)+" ("+(ld<0?"EXPIROVAL!":ld+" dni")+")"
      +"\nSkolenie: "+(d.trainingValid?"platn\u00E9 do "+fmtDate(d.trainingExp):"EXPIROVANE!")
      +"\nOpravnenie: "+(d.authorized?"ano":"NIE - neopravneny vodic!");
    return wrap(r);
  }

  // Keyword routing
  if(ql.indexOf("upozorn")>=0||ql.indexOf("urgent")>=0||ql.indexOf("krizy")>=0||ql.indexOf("problem")>=0||ql.indexOf("pozornost")>=0){
    if(!urgent.length && !inSvc.length) return wrap("Vsetko je v poriadku. \u017Diadne urgentn\u00E9 upozornenia.");
    var lines=[];
    if(inSvc.length) lines.push("V servise: "+inSvc.map(function(v){return v.spz;}).join(", "));
    urgent.forEach(function(v){
      var sd=daysTo(v.stk),kl=kmLeft(v);
      if(sd<=30) lines.push(v.spz+": STK expiruje za "+sd+" dni");
      if(kmLeft(v)<=5000) lines.push(v.spz+": servis nutny, zostatok "+kl+" km");
    });
    return pfx(lines.slice(0,6).join("\n"));
  }

  if(ql.indexOf("stk")>=0||ql.indexOf("technicka kontrola")>=0){
    var stkExp=VEHICLES.filter(function(v){return daysTo(v.stk)<=60;});
    if(!stkExp.length) return wrap("V\u0161etky STK su v poriadku, ziadna neexpiruje do 60 dni.");
    return pfx("STK expiruje v nasledujucich 60 dnoch:\n"+stkExp.map(function(v){var d=daysTo(v.stk);return v.spz+" "+v.make+" "+v.model+": "+(d<0?"U\u017D EXPIROVALA!":d+" dni - "+fmtDate(v.stk));}).join("\n"));
  }

  if(ql.indexOf("poist")>=0){
    var pExp=VEHICLES.filter(function(v){return daysTo(v.insurance)<=60;});
    if(!pExp.length) return wrap("V\u0161etky poistenia su v poriadku.");
    return pfx("Poistenie expiruje:\n"+pExp.map(function(v){return v.spz+": "+fmtDate(v.insurance);}).join("\n"));
  }

  if(ql.indexOf("servis")>=0||ql.indexOf("udrzba")>=0||ql.indexOf("oprava")>=0){
    var srvKm=VEHICLES.filter(function(v){return kmLeft(v)<=5000&&v.status==="aktivne";});
    var r2=[];
    if(inSvc.length) r2.push("Moment\u00E1lne v servise: "+inSvc.map(function(v){return v.spz+" - "+v.note;}).join("; "));
    if(srvKm.length) r2.push("Bl\u00ED\u017Ei sa servis (do 5000 km): "+srvKm.map(function(v){return v.spz+" (+"+kmLeft(v)+"km)";}).join(", "));
    return r2.length?pfx(r2.join("\n")):wrap("\u017Diadne vozidlo nepotrebuje servis v kr\u00E1tkodobom horizonte.");
  }

  if(ql.indexOf("vodic")>=0||ql.indexOf("sofer")>=0||ql.indexOf("pilot")>=0||ql.indexOf("driver")>=0){
    var issues=[];
    if(noTrain.length) issues.push("Expirovan\u00E9 \u0161kolenie: "+noTrain.map(function(d){return d.name;}).join(", "));
    if(expVP.length) issues.push("VP expiruje do 90 dn\u00ED: "+expVP.map(function(d){return d.name+" ("+daysTo(d.licenseExp)+"d)";}).join(", "));
    var unauth=DRIVERS.filter(function(d){return !d.authorized;});
    if(unauth.length) issues.push("Neopr\u00E1vnen\u00ED vodi\u010Di: "+unauth.map(function(d){return d.name;}).join(", "));
    return issues.length?pfx(issues.join("\n")):wrap("V\u0161etci vodic? maju platn\u00E9 doklady a skolenia.");
  }

  if(ql.indexOf("vozidl")>=0||ql.indexOf("auto")>=0||ql.indexOf("flot")>=0||ql.indexOf("celk")>=0||ql.indexOf("stav")>=0||ql.indexOf("preh")>=0){
    return pfx("Stav flotily: "+VEHICLES.length+" vozidiel celkom\n"
      +"Akt\u00EDvne: "+active.length+" | V servise: "+inSvc.length+" | Vy\u017Eaduje pozornos\u0165: "+urgent.length+"\n"
      +"Vodi\u010Dov: "+DRIVERS.length+" | Bez platn\u00E9ho \u0161kolenia: "+noTrain.length);
  }

  if(ql.indexOf("naklady")>=0||ql.indexOf("cena")>=0||ql.indexOf("eur")>=0||ql.indexOf("cost")>=0){
    var total=VEHICLES.reduce(function(s,v){return s+(v.cost||0);},0);
    var top=VEHICLES.slice().sort(function(a,b){return b.cost-a.cost;}).slice(0,3);
    return pfx("Celkov\u00E9 servisn\u00E9 n\u00E1klady: "+fmtEur(total)+"\nNajdrah\u0161ie: "+top.map(function(v){return v.spz+" ("+fmtEur(v.cost)+")";}).join(", "));
  }

  if(ql.indexOf("kniazn")>=0||ql.indexOf("jazd")>=0||ql.indexOf("km")>=0||ql.indexOf("kilom")>=0){
    var sorted=VEHICLES.slice().sort(function(a,b){return b.km-a.km;});
    return pfx("Najvy\u0161\u0161\u00ED n\u00E1jazd: "+sorted.slice(0,3).map(function(v){return v.spz+" - "+v.km.toLocaleString("sk")+"km";}).join(", "));
  }

  if(ql.indexOf("dialn")>=0||ql.indexOf("znamk")>=0||ql.indexOf("vignet")>=0){
    var czVeh=VEHICLES.filter(function(v){return v.vignettes&&v.vignettes.indexOf("CZ")>=0;});
    var atVeh=VEHICLES.filter(function(v){return v.vignettes&&v.vignettes.indexOf("AT")>=0;});
    return pfx("Dia\u013Eni\u010Dn\u00E9 zn\u00E1mky:\nSK: vsetky vozidla ("+VEHICLES.length+")\nCZ: "+czVeh.length+" vozidiel\nAT: "+atVeh.length+" vozidiel");
  }

  // Default by persona
  if(p==="hoke") return "Dobr\u00FD de\u0148. M\u00F4\u017Eem v\u00E1s informova\u0165 o stave vozidiel, STK, poisten\u00ED, servisoch alebo vodi\u010Doch. \u010C\u00EDm v\u00E1m m\u00F4\u017Eem pom\u00F4c\u0165?";
  if(p==="han") return "Po\u010Duj, na to ti odpove\u010F neviem \u2013 sk\u00FAs sa p\u00FDta\u0165 na konkr\u00E9tne vozidlo (napr. ZA001AA), vodi\u010Da, STK, servis alebo stav flotily. M\u00E1m v\u0161etky d\u00E1ta z lode!";
  return "Pred prechodom na druh\u00FA stranu potrebujem presnej\u0161\u00ED dotaz. Sp\u00FDtaj sa na konkr\u00E9tne vozidlo, vodica, STK, poistenie alebo servis.";
}

    name: "Charon",
    sub: "Kontrolor rozpoctov a pravidiel",
    avatar: "?",
    bg: "linear-gradient(135deg,#1a0a0a,#3d1515)",
    headBg: "linear-gradient(135deg,#1a0a0a,#3d1515)",
    msgBg: "#1c0f0f", msgColor: "#e8c9a0",
    fabBg: "#3d1515", fabColor: "#c9a96e",
    inputBg: "rgba(255,255,255,0.08)",
    systemPrompt: `Si Charon - prevoznik du?i z gr?ckej mytol?gie. Si pragmatick?, ne?prosn? str??ca pravidiel a kontrol?r rozpo?tov vo vozdovom parku firmy Martinus. Hovoris v mytologickom t?ne - jazdy su "preplavy", blo?ek z pumpy je "obolus", auto je "lo?", klu?e su "veslo". Si vecny a ne?prosn? - kym niekto nespln? povinnosti (blo?ek, kniha jazd), nedostane ?al?ie auto. Ale si aj vtipn? - tvoja pr?snos? je z?mern? a trochu teatr?lna. Pouzivas fr?zy ako "Tvoja cesta skoncila", "Bez obolu necestujes", "Rieka Styx caka". Hovoris kratko, vecne, trochu dramaticky. Si AI asistent pre re?lne d?ta vozoveho parku.`,
    greeting: "Vitaj, smrtelnik. Tvoja jazda moze zacit - ale najprv mi povez: je tvoja kniha jazd kompletna? Bez obolu sa k mne neplav."
  }
};

var currentPersona = "hoke";
var chatOpen = false;
var chatHistory = [];
var isLoading = false;

function getFleetContext() {
  var urgent = [];
  VEHICLES.forEach(function(v){
    var sd=daysTo(v.stk),id2=daysTo(v.insurance),kl=kmLeft(v);
    if(sd<=30) urgent.push(v.spz+": STK expiruje za "+sd+" dni");
    if(id2<=30) urgent.push(v.spz+": Poistenie expiruje za "+id2+" dni");
    if(kl<=5000&&v.status==="aktivne") urgent.push(v.spz+": Servis nutny, zostatok "+kl+" km");
    if(v.status==="servis") urgent.push(v.spz+": Momentalne v servise ("+v.note+")");
  });
  DRIVERS.forEach(function(d){
    var ld=daysTo(d.licenseExp);
    if(ld<=60&&ld>0) urgent.push(d.name+": VP expiruje za "+ld+" dni");
    if(!d.authorized) urgent.push(d.name+": Nema platne opravnenie na jazdu");
    if(!d.trainingValid) urgent.push(d.name+": Skolenie expirovan?");
  });

  var summary = {
    celkomVozidiel: VEHICLES.length,
    aktivne: VEHICLES.filter(function(v){return v.status==="aktivne";}).length,
    vServise: VEHICLES.filter(function(v){return v.status==="servis";}).length,
    celkomVodi\u010Dov: DRIVERS.length,
    neopravneni: DRIVERS.filter(function(d){return !d.authorized;}).length,
    urgentneUpozornenia: urgent,
    vozidla: VEHICLES.map(function(v){
      var dr=DRIVERS.find(function(d){return d.id===v.driverId;});
      return {spz:v.spz,vozidlo:v.make+" "+v.model,rok:v.year,km:v.km,status:v.status,vodic:dr?dr.name:"nepriradeny",stk:v.stk,poistenie:v.insurance,servisPri:v.nextServiceKm,zostatokKm:kmLeft(v),lokacia:v.location};
    }),
    vodici: DRIVERS.map(function(d){
      var v=VEHICLES.find(function(vv){return vv.id===d.vehicleId;});
      return {meno:d.name,rola:d.role,vozidlo:v?v.spz+" "+v.make:"bez vozidla",opravneny:d.authorized,skolenie:d.trainingValid,vpPlatnost:d.licenseExp,skoleniePlatnost:d.trainingExp};
    }),
  };
  return summary;
}

function buildSystemPrompt(persona) {
  var ctx = getFleetContext();
  var p = PERSONAS[persona];
  return p.systemPrompt + "\n\nAKTUALNE DATA VOZOVEHO PARKU MARTINUS:\n" + JSON.stringify(ctx, null, 2);
}

function getNotifications() {
  var p = PERSONAS[currentPersona];
  var msgs = [];
  VEHICLES.forEach(function(v){
    var sd=daysTo(v.stk);
    if(sd>=0&&sd<=14) msgs.push({type:"danger",text:v.spz+" "+v.make+" "+v.model+": STK expiruje o "+sd+" dni!"});
    if(sd<0) msgs.push({type:"danger",text:v.spz+": STK uz EXPIROVALO!"});
    var id2=daysTo(v.insurance);
    if(id2>=0&&id2<=14) msgs.push({type:"warning",text:v.spz+": Poistenie expiruje o "+id2+" dni"});
    var kl=kmLeft(v);
    if(kl<=2000&&v.status==="aktivne") msgs.push({type:"warning",text:v.spz+": Zostatok do servisu iba "+kl+" km!"});
  });
  DRIVERS.forEach(function(d){
    if(!d.authorized) msgs.push({type:"danger",text:d.name+" nema platne opravnenie na jazdu!"});
    if(!d.trainingValid) msgs.push({type:"warning",text:d.name+": Skolenie expirovan? - nutna obnova."});
  });
  return msgs;
}

function notifPrefix(type) {
  if(currentPersona==="hoke") return type==="danger"?"Dovolte mi upozornit: ":"Rada pre Vas: ";
  if(currentPersona==="han") return type==="danger"?"POZOR, kapitane! ":"Signal z flotily: ";
  return type==="danger"?"ZASTAVIT! ":"Obol chybajuci: ";
}


function appendMsg(role, text, isNotif, notifType) {
  var p = PERSONAS[currentPersona];
  var el = document.createElement("div");
  var now = new Date().toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"});

  if(role === "user") {
    el.className = "msg msg-user";
    el.innerHTML = text + '<div class="msg-time" style="text-align:right;">'+now+'</div>';
  } else {
    el.className = "msg msg-bot" + (isNotif?" msg-notif":"");
    el.style.background = p.msgBg;
    el.style.color = p.msgColor;
    if(isNotif) el.style.borderColor = notifType==="danger"?"#ef4444":"#f97316";
    el.innerHTML = text.replace(/\n/g,"<br>") + '<div class="msg-time">'+now+'</div>';
  }
  var mc = document.getElementById("chat-messages");
  mc.appendChild(el);
  mc.scrollTop = mc.scrollHeight;
}

function showLoading() {
  var p = PERSONAS[currentPersona];
  var el = document.createElement("div");
  el.id = "chat-loader";
  el.className = "msg msg-bot msg-loading";
  el.style.background = p.msgBg;
  var c = p.msgColor;
  el.innerHTML = '<div class="dot" style="background:'+c+'"></div><div class="dot" style="background:'+c+'"></div><div class="dot" style="background:'+c+'"></div>';
  document.getElementById("chat-messages").appendChild(el);
  document.getElementById("chat-messages").scrollTop = 99999;
}

function hideLoading() {
  var el = document.getElementById("chat-loader");
  if(el) el.remove();
}

async function sendMsg() {
  if(isLoading) return;
  var inp = document.getElementById("chat-input");
  var text = inp.value.trim();
  if(!text) return;
  inp.value = "";

  appendMsg("user", text);
  chatHistory.push({role:"user",content:text});

  isLoading = true;
  showLoading();

  try {
    var reply = await callAI(text);
    hideLoading();
    appendMsg("bot", reply);
    chatHistory.push({role:"assistant",content:reply});
  } catch(e) {
    hideLoading();
    appendMsg("bot","Ospravedlnujem sa, nastala technicka chyba. Skuste to prosim znovu.");
  }
  isLoading = false;
}

function renderQuickActions() {
  var qa;
  if(currentPersona==="hoke") qa=["Urgentn\u00E9 upozornenia","Stav vozov\u00E9ho parku","Ktor\u00E9 auto potrebuje servis","Ktor\u00ED vodi\u010Di maj\u00FA expiruj\u00FAce VP"];
  else if(currentPersona==="han") qa=["Ktor\u00E9 lode s\u00FA v doku?","Kriza! Rychly prehlad!","N\u00E1jdi mi vo\u013En\u00E9ho pilota","\u010Cas na hyperpriestorov\u00FD skok?"];
  else qa=["Kto mi dlhuje obolus?","Uzavri jazdu","Kto nem\u00E1 splnen\u00E9 povinnosti?","Preh\u013Ead du?i v systeme"];

  var p = PERSONAS[currentPersona];
  document.getElementById("chat-quick").innerHTML = qa.map(function(q){
    return '<button class="qbtn" onclick="quickAsk(\''+q+'\')" style="color:'+p.msgColor+';background:'+p.msgBg+';border-color:'+p.msgColor+'33;">'+q+'</button>';
  }).join("");
}

function quickAsk(q) {
  document.getElementById("chat-input").value = q;
  sendMsg();
}

function switchPersona(key) {
  currentPersona = key;
  chatHistory = [];
  document.querySelectorAll(".persona-btn").forEach(function(b){b.classList.remove("active");});
  document.getElementById("pbtn-"+key).classList.add("active");

  var p = PERSONAS[key];
  var win = document.getElementById("chat-window");
  win.style.background = p.bg;
  document.getElementById("chat-head").style.background = p.headBg;
  document.getElementById("chat-persona-avatar").textContent = p.avatar;
  document.getElementById("chat-persona-name").textContent = p.name;
  document.getElementById("chat-persona-name").style.color = "#fff";
  document.getElementById("chat-persona-sub").textContent = p.sub;
  document.getElementById("chat-persona-sub").style.color = "rgba(255,255,255,0.65)";

  var inp = document.getElementById("chat-input");
  inp.style.background = p.inputBg;
  inp.style.color = "#fff";
  inp.style.setProperty("--placeholder","rgba(255,255,255,0.5)");

  var fab = document.getElementById("chat-fab");
  fab.style.background = p.fabBg;
  fab.textContent = p.avatar;

  document.getElementById("chat-messages").innerHTML = "";
  renderQuickActions();

  // Greeting + notifications
  setTimeout(function(){
    appendMsg("bot", p.greeting);
    chatHistory.push({role:"assistant",content:p.greeting});

    var notifs = getNotifications();
    if(notifs.length > 0) {
      setTimeout(function(){
        var notifText = notifs.slice(0,3).map(function(n){return notifPrefix(n.type)+n.text;}).join("\n");
        if(notifs.length>3) notifText+="\n...a "+(notifs.length-3)+" dalsich upozorneni.";
        appendMsg("bot", notifText, true, "warning");
      }, 700);
    }
  }, 200);

  // Switcher button styles
  document.querySelectorAll(".persona-btn").forEach(function(b){
    b.style.background = "rgba(255,255,255,0.08)";
    b.style.color = "rgba(255,255,255,0.6)";
  });
  var activeBtn = document.getElementById("pbtn-"+key);
  activeBtn.style.background = "rgba(255,255,255,0.22)";
  activeBtn.style.color = "#fff";
}

function toggleChat() {
  chatOpen = !chatOpen;
  var win = document.getElementById("chat-window");
  if(chatOpen) {
    win.classList.add("open");
    if(document.getElementById("chat-messages").children.length === 0) {
      switchPersona("hoke");
    }
    document.getElementById("chat-input").focus();
  } else {
    win.classList.remove("open");
  }
}

// Init FAB style
(function(){
  var p = PERSONAS["hoke"];
  var fab = document.getElementById("chat-fab");
  fab.style.background = p.fabBg;
  fab.style.color = p.fabColor;
})();
</script>
